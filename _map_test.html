rally Trinitarian in practice, though founder Barton W. Stone held a subordinationist view of the Son. Baptizes believers by immersion with the Matthean formula (“in the name of the Father, and of the Son, and of the Holy Spirit”). Here the Disciples of Christ sit toward the mainline and united churches, and the a cappella Churches of Christ toward the independent Baptists.","about":"The American Restoration Movement of the early 1800s (Barton W. Stone, Alexander Campbell): no creed but the Bible, aiming to restore the New Testament church, with believers baptized by immersion. Churches of Christ, Christian Churches and the Disciples of Christ. Includes: International Churches of Christ, Christian Churches & Churches of Christ, Churches of Christ (a cappella), Christian Church (Disciples of Christ)."},{"id":"churches-of-christ-a-cappella","x":1689.5,"y":997.5,"r":45.4,"label":"Churches of\nChrist (a\ncappella)","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":2,"dashed":true},{"id":"christian-church-disciples-of-christ","x":1574.2,"y":1009.8,"r":54.6,"label":"Christian\nChurch\n(Disciples of\nChrist)","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":2,"dashed":true},{"id":"christian-churches-churches-of-christ","x":1561.9,"y":894.4,"r":48.9,"label":"Christian\nChurches &\nChurches of\nChrist","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":2,"dashed":true},{"id":"international-churches-of-christ","x":1677.2,"y":882.1,"r":51.6,"label":"International\nChurches of\nChrist","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":2,"dashed":true},{"id":"african-initiated-churches","x":493.0,"y":2294.9,"r":186.1,"label":"African initiated\nchurches","fontSize":13,"stroke":"#1f6f78","fill":"#f0f7f7","textColor":"#1f6f78","strokeWidth":1.8,"fontWeight":"600","z":1,"labelDy":-161.6,"about":"Churches founded by Africans outside the missionary denominations since the late 1800s: the 'Zionist' churches of southern Africa, the Aladura ('praying people') churches of Nigeria, the Kimbanguists of Congo and others, with tens of millions of members. Prophecy, healing and white robes are common; beliefs vary, and a few give their founders exalted roles that other churches question. Includes: Cherubim & Seraphim, Kimbanguist Church, Celestial Church of Christ, Zion Christian Church, Church of the Lord (Aladura)."},{"id":"zion-christian-church","x":587.6,"y":2310.0,"r":52.5,"label":"Zion Christian\nChurch","fontSize":11,"stroke":"#1f6f78","fill":"#ffffff","textColor":"#1f6f78","strokeWidth":1.4,"fontWeight":"500","z":2},{"id":"kimbanguist-church","x":534.1,"y":2222.8,"r":42.8,"label":"Kimbanguist\nChurch","fontSize":11,"stroke":"#1f6f78","fill":"#ffffff","textColor":"#1f6f78","strokeWidth":1.4,"fontWeight":"500","z":2},{"id":"celestial-church-of-christ","x":468.9,"y":2310.0,"r":59.1,"label":"Celestial Church\nof Christ","fontSize":11,"stroke":"#1f6f78","fill":"#ffffff","textColor":"#1f6f78","strokeWidth":1.4,"fontWeight":"500","z":2},{"id":"cherubim-seraphim","x":446.2,"y":2206.7,"r":39.6,"label":"Cherubim &\nSeraphim","fontSize":11,"stroke":"#1f6f78","fill":"#ffffff","textColor":"#1f6f78","strokeWidth":1.4,"fontWeight":"500","z":2},{"id":"church-of-the-lord-aladura","x":534.6,"y":2408.8,"r":52.5,"label":"Church of the\nLord (Aladura)","fontSize":11,"stroke":"#1f6f78","fill":"#ffffff","textColor":"#1f6f78","strokeWidth":1.4,"fontWeight":"500","z":2},{"id":"oneness-pentecostal","x":792.3,"y":2819.2,"r":124.9,"label":"Oneness Pentecostal","fontSize":12.5,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.8,"fontWeight":"600","z":20,"dashed":true,"labelDy":-108.8,"note":"Modalism: one God who shows himself as Father, Son and Holy Spirit rather than being three persons, and who is wholly present in Jesus. Baptizes in Jesus' name only (Acts 2:38), and usually teaches that speaking in tongues is part of the new birth. Placed beside the Pentecostal churches it split from: the “New Issue” arose in 1913–14, as the Assemblies of God was forming (1914), and Oneness ministers left in 1916.","about":"Pentecostals who left the Assemblies of God in 1916 over the doctrine of God (the 'New Issue'); today mainly the United Pentecostal Church International and the Pentecostal Assemblies of the World. Includes: Pentecostal Assemblies of the World, United Pentecostal Church Int'l."},{"id":"united-pentecostal-church-int-l","x":847.4,"y":2829.6,"r":48.5,"label":"United\nPentecostal\nChurch Int'l","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"pentecostal-assemblies-of-the-world","x":740.4,"y":2829.6,"r":51.6,"label":"Pentecostal\nAssemblies of\nthe World","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"community-of-christ","x":2507.7,"y":904.6,"r":53.8,"label":"Community of\nChrist","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Formerly the Reorganized Church of Jesus Christ of Latter Day Saints (1860), led by Joseph Smith's descendants until 1996. Since the 1990s and 2000s it has affirmed the Trinity, ordained women, and stopped treating the Book of Mormon as a test of faith, and it now sits much closer to mainline Protestantism than to the LDS Church."},{"id":"messianic-judaism","x":239.0,"y":2294.6,"r":42.5,"label":"Messianic\nJudaism","fontSize":13,"stroke":"#5f6b1f","fill":"#eef0da","textColor":"#5f6b1f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Congregations of Jewish (and non-Jewish) believers in Jesus (Yeshua) as the Messiah that keep Jewish practice: the Sabbath, the festivals and Hebrew liturgy, with evangelical, Nicene belief about Christ. It grew from the 1960s and 70s; most Jewish bodies don't regard it as Judaism."},{"id":"christadelphians","x":2702.5,"y":2135.9,"r":68.0,"label":"Christadelphians","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Founded by John Thomas in the 1840s: lay-led and Bible-only, denying the Trinity and Jesus' existence before his birth."},{"id":"armstrong-line-churches-of-god","x":2720.3,"y":1193.9,"r":131.1,"label":"Armstrong-line\nChurches of God","fontSize":12.5,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.8,"fontWeight":"600","z":20,"dashed":true,"labelDy":-107.3,"about":"Only the non-Trinitarian successors of Herbert W. Armstrong's Worldwide Church of God: the United Church of God, the Living Church of God and others that left when the WCG became Trinitarian in the 1990s. The WCG itself, now Grace Communion International, is an evangelical Protestant church. Includes: United Church of God, Living Church of God."},{"id":"united-church-of-god","x":2667.5,"y":1211.9,"r":49.3,"label":"United Church\nof God","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"living-church-of-god","x":2773.0,"y":1211.9,"r":49.3,"label":"Living Church\nof God","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"swedenborgian","x":2140.4,"y":2825.3,"r":57.7,"label":"Swedenborgian\n(New Church)","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Follows the visions of Emanuel Swedenborg (1700s): Jesus is the one God, and Swedenborg's writings reveal the inner meaning of Scripture."},{"id":"bible-student-movement","x":2749.9,"y":898.7,"r":121.5,"label":"Bible Student\nmovement","fontSize":12.5,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.8,"fontWeight":"600","z":20,"dashed":true,"labelDy":-97.7,"about":"From Charles Taze Russell's Bible study movement of the 1870s. Jehovah's Witnesses, led by a Governing Body, are by far the largest part; independent Bible Students keep Russell's older ways. Includes: Bible Students (independent), Jehovah's Witnesses."},{"id":"jehovah-s-witnesses","x":2806.0,"y":916.8,"r":36.4,"label":"Jehovah's\nWitnesses","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"bible-students-independent","x":2710.0,"y":916.8,"r":52.5,"label":"Bible Students\n(independent)","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"latter-day-saint-movement","x":2670.5,"y":414.9,"r":194.9,"label":"Latter Day Saint\nmovement","fontSize":12.5,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.8,"fontWeight":"600","z":20,"dashed":true,"labelDy":-171.1,"about":"Founded by Joseph Smith in 1830. Adds the Book of Mormon and other scripture and is led by living prophets and apostles. The Church of Jesus Christ of Latter-day Saints is by far the largest body. (Community of Christ, the second largest, has moved away and is shown on its own.) Includes: Remnant Church, FLDS Church, Strangite Church, Church of Christ (Temple Lot), The Church of Jesus Christ (Bickertonite), Church of Jesus Christ of Latter-day Saints."},{"id":"church-of-jesus-christ-of-latter-day-saints","x":2677.2,"y":544.1,"r":54.6,"label":"Church of\nJesus Christ\nof Latter-day\nSaints","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"church-of-christ-temple-lot","x":2619.1,"y":443.4,"r":54.7,"label":"Church of\nChrist (Temple\nLot)","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"the-church-of-jesus-christ-bickertonite","x":2735.4,"y":443.4,"r":54.7,"label":"The Church of\nJesus Christ\n(Bickertonite)","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"remnant-church","x":2677.2,"y":346.7,"r":51.2,"label":"Remnant Church","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"flds-church","x":2578.0,"y":349.2,"r":41.1,"label":"FLDS Church","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"strangite-church","x":2771.7,"y":352.3,"r":36.4,"label":"Strangite\nChurch","fontSize":11,"stroke":"#6a3f8f","fill":"#ffffff","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":21,"dashed":true},{"id":"iglesia-ni-cristo","x":3210.8,"y":1668.1,"r":46.2,"label":"Iglesia ni\nCristo","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Founded in the Philippines in 1914 by Felix Manalo, seen as God's last messenger. Jesus is the Son of God but not God."},{"id":"christian-science","x":3186.0,"y":2242.8,"r":42.5,"label":"Christian\nScience","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Founded by Mary Baker Eddy (1879): God is divine Mind, and sickness and matter are finally unreal. Her Science and Health is read alongside the Bible."},{"id":"unification-church","x":3023.4,"y":2751.4,"r":50.0,"label":"Unification\nChurch","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Founded by Sun Myung Moon in Korea (1954), whom members see as the messiah completing Christ's mission. Now the Family Federation for World Peace and Unification."},{"id":"unitarian-universalism","x":2710.0,"y":3208.7,"r":53.8,"label":"Unitarian\nUniversalism","fontSize":13,"stroke":"#6a3f8f","fill":"#f1eaf6","textColor":"#6a3f8f","strokeWidth":1.4,"fontWeight":"500","z":20,"dashed":true,"about":"Grew from the Unitarian and Universalist churches of New England. Now a faith without a creed, where members search for truth freely; most don't identify as Christian."},{"id":"title","type":"text","x":1663.5,"y":100,"label":"The five families of Christianity","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50},{"id":"subtitle","type":"text","x":1663.5,"y":146,"label":"Apostolic–liturgical, confessional Protestant, believers' church, holiness–Pentecostal–charismatic, and Restorationists","fontSize":15,"textColor":"#1f2b23","fontWeight":"400","z":50},{"id":"legend","type":"text","x":1663.5,"y":3374.3,"label":"Solid circles: apostolic–liturgical (gold; Orthodox and Eastern churches in blue), confessional or magisterial Protestant (green),\nbelievers' church or free church (red) and holiness, Pentecostal & charismatic (teal) churches, with the groups within them.\nDashed purple: restorationist and related movements. Inside the big circle = generally counted within Christianity;\nstraddling the edge = self-identified Christian but outside mainstream (Nicene) consensus; outside = distinct movements with Christian roots.\nShared dashed-purple styling marks a restorationist method, not equal distance from Nicene Christianity: the farther from the centre, the farther from Nicene faith. Dashed olive: Messianic Judaism (Jewish practice, Nicene faith in Jesus).\nPlacement reflects common scholarly classification; many groups describe themselves differently. Click a group to learn more.","fontSize":13,"textColor":"#1f2b23","fontWeight":"400","z":50}],"arrows":[]}},{"id":"high-low","name":"Spectrum: high church → low church","about":"Top box = Christian religion; edge = heterodox Christian adjacent; bottom box = another religion with Christian roots.","diagram":{"canvas":{"width":2026,"height":2299},"shapes":[{"id":"christianity","type":"rect","x":997.9,"y":594.9,"w":1710,"h":774.6,"label":"Christianity","fontSize":34,"stroke":"#1f2b23","fill":"#fdfcf8","textColor":"#1f2b23","strokeWidth":3,"fontWeight":"700","labelDy":-351.5,"z":-1,"note":"Christianity is the one religion of the God of Israel that confesses Jesus of Nazareth as Messiah and risen Lord, distinct from the Father who sent and raised him; receives the Jewish Scriptures and the apostolic writings as a closed canon; and gathers people by baptism and the Lord’s Supper."},{"id":"christian-rooted","type":"rect","x":997.9,"y":1618.8,"w":1710,"h":591.2,"label":"Christian-rooted movements","fontSize":28,"stroke":"#6a3f8f","fill":"#f6f0f8","textColor":"#6a3f8f","strokeWidth":2.6,"fontWeight":"700","labelDy":-264.0,"z":-1,"note":"Christian-rooted movements: groups that use Christian language but change the God, the Christ, or the canon.","dashed":true},{"id":"scale","type":"rect","x":997.9,"y":1108.2,"w":1450,"h":38.6,"label":"","stroke":"none","strokeWidth":0,"fill":"#6a3f8f","gradient":["#6a3f8f","#e3b51c"],"decor":true,"z":-3},{"id":"scale-frame","type":"image","x":997.9,"y":1108.2,"w":1471.7,"h":70.0,"href":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABMQAAAA6CAYAAABf54WAAAABhmlDQ1BJQ0MgUHJvZmlsZQAAeJx9kb9Lw0AcxV9TpSoVRYuIOGSoTnZREcGlVLEIFkpboVUHk0t/QZOGJMXFUXAtOPhjserg4qyrg6sgCP4A8Q8QJ0UXKfF7SaFFrAfHfXh373H3DhBqJaaaHWFA1SwjEY2I6cyq6HtFN4bQjwHMSczUY8nFFNqOr3t4+HoX4lntz/05epWsyQCPSBxmumERbxDPbFo6533iACtICvE58YRBFyR+5Lrs8hvnvMMCzwwYqcQ8cYBYzLew3MKsYKjE08RBRdUoX0i7rHDe4qyWKqxxT/5Cf1ZbSXKd5iiiWEIMcYiQUUERJVgI0aqRYiJB+5E2/hHHHyeXTK4iGDkWUIYKyfGD/8Hvbs3c1KSb5I8AnS+2/TEG+HaBetW2v49tu34CeJ+BK63pL9eA2U/Sq00teAT0bQMX101N3gMud4DhJ10yJEfy0hRyOeD9jL4pAwzeAj1rbm+NfZw+ACnqavkGODgExvOUvd7m3V2tvf17ptHfD/iGctyqfHCFAAAEy ouncils, the bishops and the liturgy rather than by one head. Includes: Eastern Orthodox, Oriental Orthodox, Church of the East.","leadTo":[345.4,1088.9]},{"id":"separated-catholic-groups","type":"rect","x":403.4,"y":379.9,"w":180.0,"h":118.0,"label":"Separated\nCatholic\ngroups","fontSize":30,"stroke":"#8a6a1f","fill":"transparent","strokeWidth":0,"textColor":"#8a6a1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"High church: they keep the Catholic Mass (often the traditional Latin Mass) and priests and bishops.","about":"Groups that keep Catholic worship and bishops but are outside communion with Rome, from the Old Catholics of the 1870s to today's traditionalist groups. Includes: Old Catholic (Union of Utrecht), Polish National Catholic, SSPX (canonically irregular), Sedevacantists, Independent Catholic.","leadTo":[403.4,1088.9]},{"id":"separated-eastern-groups","type":"rect","x":388.9,"y":643.9,"w":180.0,"h":118.0,"label":"Separated\nEastern\ngroups","fontSize":30,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Very high church: they keep the older Orthodox rites and calendar exactly; reforms to them are why they separated.","about":"Orthodox groups that broke from the main Orthodox churches over reforms: the Old Believers (1650s) and the Old Calendarists (1920s). Includes: True Orthodox (Old Calendarists), Old Believers.","leadTo":[388.9,1088.9]},{"id":"anglican","type":"rect","x":504.9,"y":543.9,"w":162.0,"h":46.0,"label":"Anglican","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"High to broad: a prayer-book liturgy and bishops everywhere, but Anglo-Catholic parishes are as high as Rome and evangelical ones much plainer.","about":"The Church of England and the churches that grew from it: Reformation teaching kept within the older pattern of bishops, liturgy and the Book of Common Prayer. Includes: Church of England, Episcopal Church (US), Anglican Church in North America, Anglican Church of Kenya, Church of Nigeria, Continuing Anglican churches.","leadTo":[504.9,1088.9]},{"id":"lutheran","type":"rect","x":707.9,"y":651.1,"w":162.0,"h":46.0,"label":"Lutheran","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Fairly high: a liturgy close to the Mass, vestments and ordained pastors, without the Catholic idea of the priesthood.","about":"Churches from Martin Luther's reformation (1517): salvation by grace through faith, the Lutheran Confessions, and worship close to the older Western liturgy. Includes: Lutheran Church–Missouri Synod, Evangelical Church in Germany (EKD), Wisconsin Synod (WELS), Mekane Yesus (Ethiopia), Nordic Lutheran churches, ELCA.","leadTo":[707.9,1088.9]},{"id":"methodist-wesleyan","type":"rect","x":823.9,"y":433.1,"w":216.0,"h":82.0,"label":"Methodist /\nWesleyan","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Middle: a liturgy inherited from the Church of England (and bishops in American Methodism) alongside revival preaching and hymn singing.","about":"Churches from John and Charles Wesley's revival in the 1700s Church of England: grace offered to all, holy living, and churches joined in conferences. Includes: United Methodist, Global Methodist, African Methodist Episcopal, AME Zion.","leadTo":[823.9,1088.9]},{"id":"reformed-presbyterian-congregational","type":"rect","x":881.9,"y":862.2,"w":270.0,"h":118.0,"label":"Reformed /\nPresbyterian /\nCongregational","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Middle to low: worship only as Scripture commands it, preaching at the centre, two plain sacraments, and ordained ministers with elders.","about":"Churches from the Swiss and Scottish reformations (Zwingli, Calvin, Knox): God's sovereignty, the Reformed confessions, and churches governed by elders. Includes: United Church of Christ, Presbyterian Church in America, Orthodox Presbyterian, Reformed Church in America, Christian Reformed Church, Church of Scotland, PC(USA).","leadTo":[881.9,1088.9]},{"id":"united-uniting-churches","type":"rect","x":852.9,"y":551.1,"w":162.0,"h":118.0,"label":"United &\nUniting\nchurches","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Middle: blends of the Reformed, Methodist and Anglican patterns they merged from; the Church of South India kept bishops.","about":"Churches formed in the 1900s by merging several Protestant traditions into one. Includes: Uniting Church in Australia, United Church of Canada, Church of South India, Church of North India.","leadTo":[852.9,1088.9]},{"id":"pre-reformation-churches","type":"rect","x":939.9,"y":744.2,"w":288.0,"h":82.0,"label":"Pre-Reformation\nchurches","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Middle: the Moravians keep bishops and a simple liturgy; the Waldensians worship in a plain Reformed style.","about":"Reform movements older than Luther: the Waldensians (1100s) and the Moravians, from the followers of Jan Hus (1400s). Includes: Waldensian Evangelical, Moravian Church.","leadTo":[939.9,1088.9]},{"id":"adventist","type":"rect","x":1113.9,"y":398.2,"w":180.0,"h":46.0,"label":"Adventist","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: simple Protestant services on Saturday, with foot washing before communion.","about":"From the Millerite movement of the 1840s: waiting for Christ's return and keeping the seventh-day Sabbath. Seventh-day Adventists see Ellen G. White as a prophet whose writings guide but don't add to Scripture. Includes: Seventh-day Adventist, Advent Christian Church.","leadTo":[1113.9,1088.9]},{"id":"baptist","type":"rect","x":1171.9,"y":462.2,"w":144.0,"h":46.0,"label":"Baptist","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: preaching at the centre, congregations governing themselves, and baptism and the Lord's Supper as ordinances rather than sacraments.","about":"Churches that baptize believers only, by immersion, with each congregation governing itself. From the English Separatists of the early 1600s. Includes: Southern Baptist Convention, American Baptist Churches USA, National Baptist Convention, Cooperative Baptist Fellowship, Free Will Baptist, Reformed Baptist, Independent Baptist, Seventh Day Baptist.","leadTo":[1171.9,1088.9]},{"id":"anabaptist","type":"rect","x":1229.9,"y":526.2,"w":198.0,"h":46.0,"label":"Anabaptist","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: plain worship with ministers chosen from the congregation; the Amish meet in homes and dress plainly.","about":"The 'radical Reformation' of the 1520s: baptism of believers, nonviolence, and churches separate from the state. Mennonites, Amish, Hutterites and Brethren. Includes: Mennonite, Amish, Hutterite, Church of the Brethren.","leadTo":[1229.9,1088.9]},{"id":"stone-campbell-restoration-movement","type":"rect","x":1316.9,"y":762.2,"w":270.0,"h":118.0,"label":"Stone-Campbell\nRestoration\nMovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: only what the New Testament shows, with the Lord's Supper every week led by elders; the a cappella churches use no instruments.","about":"The American Restoration Movement of the early 1800s (Barton W. Stone, Alexander Campbell): no creed but the Bible, aiming to restore the New Testament church, with believers baptized by immersion. Churches of Christ, Christian Churches and the Disciples of Christ. Includes: Churches of Christ (a cappella), Christian Church (Disciples of Christ), Christian Churches & Churches of Christ, International Churches of Christ.","leadTo":[1316.9,1088.9]},{"id":"nondenominational","type":"rect","x":1374.9,"y":334.2,"w":324.0,"h":46.0,"label":"Nondenominational","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: informal services and contemporary music, no set liturgy, and pastors outside any denominational system of ordination.","about":"Independent evangelical churches and networks outside the historic denominations, usually with believers' baptism and informal worship. Includes: Nondenominational evangelical, Calvary Chapel.","leadTo":[1374.9,1088.9]},{"id":"other-free-churches","type":"rect","x":1490.9,"y":563.0,"w":198.0,"h":82.0,"label":"Other free\nchurches","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Lowest church, with a split: unprogrammed Friends wait in silence with no clergy or sacraments, while programmed Friends (most Friends worldwide) have pastors and look Baptist-low. Brethren assemblies are led by laymen.","about":"The Quakers (Friends, from the 1650s) and the Plymouth Brethren (1820s: assemblies led by laymen). Unprogrammed Friends wait on the 'inner light' without clergy or sacraments; programmed Friends have pastors and services much like low-church Protestants. Includes: Quakers (Friends), Plymouth Brethren.","leadTo":[1490.9,1088.9]},{"id":"holiness","type":"rect","x":1431.4,"y":458.5,"w":162.0,"h":46.0,"label":"Holiness","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: revival preaching and testimony; the Salvation Army keeps no sacraments at all.","about":"The 1800s holiness movement that grew out of Methodism: a second work of grace that makes believers holy (entire sanctification). The Nazarenes, the Salvation Army and the Wesleyan Church. Includes: Church of the Nazarene, Salvation Army, Wesleyan Church, Free Methodist, Church of God (Anderson).","leadTo":[1432.9,1088.9]},{"id":"pentecostal","type":"rect","x":1577.9,"y":644.5,"w":216.0,"h":46.0,"label":"Pentecostal","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church: spontaneous, expressive worship with tongues, healing and prophecy in the service.","about":"The movement from the Azusa Street revival (1906): baptism in the Holy Spirit, speaking in tongues, healing and prophecy for today. Includes: Assemblies of God, Church of God in Christ, Church of God (Cleveland), Foursquare Church, Redeemed Christian Church of God.","leadTo":[1577.9,1088.9]},{"id":"charismatic","type":"rect","x":1666.4,"y":481.0,"w":216.0,"h":46.0,"label":"Charismatic","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Low church in independent churches, with informal worship and spiritual gifts; charismatic parishes inside older churches keep their liturgy.","about":"Pentecostal-style gifts of the Spirit in independent churches and within older churches, from the 1960s on. Includes: Vineyard, Independent charismatic churches.","leadTo":[1664.9,1088.9]},{"id":"african-initiated-churches","type":"rect","x":1142.9,"y":626.2,"w":180.0,"h":118.0,"label":"African\ninitiated\nchurches","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Ritual-rich but independent: robes, processions, dance and purification rites, led by prophets and bishops of their own churches.","about":"Churches founded by Africans outside the missionary denominations since the late 1800s: the 'Zionist' churches of southern Africa, the Aladura ('praying people') churches of Nigeria, the Kimbanguists of Congo and others, with tens of millions of members. Prophecy, healing and white robes are common; beliefs vary, and a few give their founders exalted roles that other churches question. Includes: Zion Christian Church, Kimbanguist Church, Celestial Church of Christ, Cherubim & Seraphim, Church of the Lord (Aladura).","leadTo":[1142.9,1088.9]},{"id":"community-of-christ","type":"rect","x":997.9,"y":982.2,"w":234.0,"h":82.0,"label":"Community of\nChrist","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Middle: planned worship and communion, an ordained priesthood open to women and men, and a mainline Protestant feel; its temple is for worship and peace, not LDS-style ordinances.","about":"Formerly the Reorganized Church of Jesus Christ of Latter Day Saints (1860), led by Joseph Smith's descendants until 1996. Since the 1990s and 2000s it has affirmed the Trinity, ordained women, and stopped treating the Book of Mormon as a test of faith, and it now sits much closer to mainline Protestantism than to the LDS Church.","edgeNote":"Christian-adjacent, but denies core tenets. Now accepts the Trinity, Jesus as risen Lord, baptism and communion; keeps an open canon (the Doctrine and Covenants still grows, and the Book of Mormon stays in use).","leadTo":[997.9,1088.9]},{"id":"messianic-judaism","type":"rect","x":1294.9,"y":982.2,"w":180.0,"h":82.0,"label":"Messianic\nJudaism","fontSize":30,"stroke":"#5f6b1f","fill":"transparent","strokeWidth":0,"textColor":"#5f6b1f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Middle: a synagogue-style service with Hebrew prayers and a Torah reading, joined to informal evangelical worship.","about":"Congregations of Jewish (and non-Jewish) believers in Jesus (Yeshua) as the Messiah that keep Jewish practice: the Sabbath, the festivals and Hebrew liturgy, with evangelical, Nicene belief about Christ. It grew from the 1960s and 70s; most Jewish bodies don't regard it as Judaism.","edgeNote":"Christian-adjacent, but differs in core practices. Accepts every core tenet (Nicene faith in Yeshua, the whole Bible, baptism and the Lord's Supper); keeps Torah practice (the Sabbath, the festivals, often kosher food) and a Jewish identity.","leadTo":[1084.9,1088.9]},{"id":"oneness-pentecostal","type":"rect","x":1582.9,"y":982.2,"w":216.0,"h":82.0,"label":"Oneness\nPentecostal","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Low church: expressive Pentecostal worship, with strict standards of dress and holiness in many churches.","about":"Pentecostals who left the Assemblies of God in 1916 over the doctrine of God (the 'New Issue'); today mainly the United Pentecostal Church International and the Pentecostal Assemblies of the World. Includes: United Pentecostal Church Int'l, Pentecostal Assemblies of the World.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah and risen Lord (fully God), the closed Bible, baptism and the Lord's Supper; denies that the Son is distinct from the Father, and so the Trinity.","leadTo":[1548.9,1088.9]},{"id":"unification-church","type":"rect","x":925.4,"y":1633.4,"w":216.0,"h":82.0,"label":"Unification\nChurch","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Ceremonial but new: its own rites, such as the mass Blessing weddings, under a strong central leadership.","about":"Founded by Sun Myung Moon in Korea (1954), whom members see as the messiah completing Christ's mission. Now the Family Federation for World Peace and Unification.","leadTo":[925.4,1127.5]},{"id":"iglesia-ni-cristo","type":"rect","x":996.4,"y":1733.4,"w":198.0,"h":82.0,"label":"Iglesia ni\nCristo","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Formal and centralized: the same order of worship everywhere, led by ordained ministers under the Executive Minister.","about":"Founded in the Philippines in 1914 by Felix Manalo, seen as God's last messenger. Jesus is the Son of God but not God.","leadTo":[997.9,1127.5]},{"id":"unitarian-universalism","type":"rect","x":1142.9,"y":1433.4,"w":234.0,"h":82.0,"label":"Unitarian\nUniversalism","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Low church: each congregation shapes its own services, often with readings and music but no required rites.","about":"Grew from the Unitarian and Universalist churches of New England. Now a faith without a creed, where members search for truth freely; most don't identify as Christian.","leadTo":[1142.9,1127.5]},{"id":"christian-science","type":"rect","x":1231.4,"y":1833.4,"w":180.0,"h":82.0,"label":"Christian\nScience","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Low church: no clergy; services are readings from the Bible and Science and Health by elected Readers.","about":"Founded by Mary Baker Eddy (1879): God is divine Mind, and sickness and matter are finally unreal. Her Science and Health is read alongside the Bible.","leadTo":[1229.9,1127.5]},{"id":"swedenborgian","type":"rect","x":1070.4,"y":1533.4,"w":252.0,"h":82.0,"label":"Swedenborgian\n(New Church)","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Middle: a liturgy and ordained ministers, with worship shaped by Swedenborg's teaching.","about":"Follows the visions of Emanuel Swedenborg (1700s): Jesus is the one God, and Swedenborg's writings reveal the inner meaning of Scripture.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts Jesus as God, baptism and communion; denies that the Father and Son are distinct persons, and the closed canon (Swedenborg's writings reveal Scripture's inner meaning).","leadTo":[1070.4,1127.5]},{"id":"armstrong-line-churches-of-god","type":"rect","x":1345.9,"y":1733.4,"w":288.0,"h":82.0,"label":"Armstrong-line\nChurches of God","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Low church: Saturday Sabbath services built around sermons, plus the Old Testament festivals, with ministers ordained by the church's leaders.","about":"Only the non-Trinitarian successors of Herbert W. Armstrong's Worldwide Church of God: the United Church of God, the Living Church of God and others that left when the WCG became Trinitarian in the 1990s. The WCG itself, now Grace Communion International, is an evangelical Protestant church. Includes: United Church of God, Living Church of God.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the Bible and Jesus as the divine Son, distinct from the Father, with baptism; denies the Trinity (the Spirit is God's power), keeps a yearly Passover in place of the Lord's Supper, and teaches believers will become God-beings.","leadTo":[1345.9,1127.5]},{"id":"latter-day-saint-movement","type":"rect","x":1461.9,"y":1451.4,"w":198.0,"h":118.0,"label":"Latter Day\nSaint\nmovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Plain in style but ordered: simple Sunday meetings led by lay clergy, alongside elaborate temple ceremonies and a strict order of priesthood.","about":"Founded by Joseph Smith in 1830. Adds the Book of Mormon and other scripture and is led by living prophets and apostles. The Church of Jesus Christ of Latter-day Saints is by far the largest body. (Community of Christ, the second largest, has moved away and is shown on its own.) Includes: Church of Jesus Christ of Latter-day Saints, Church of Christ (Temple Lot), The Church of Jesus Christ (Bickertonite), Remnant Church, FLDS Church, Strangite Church.","leadTo":[1461.9,1127.5]},{"id":"bible-student-movement","type":"rect","x":1548.9,"y":1633.4,"w":252.0,"h":82.0,"label":"Bible Student\nmovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Low church: meetings in plain Kingdom Halls, no clergy class and no liturgy; the Memorial of Christ's death is kept once a year.","about":"From Charles Taze Russell's Bible study movement of the 1870s. Jehovah's Witnesses, led by a Governing Body, are by far the largest part; independent Bible Students keep Russell's older ways. Includes: Jehovah's Witnesses, Bible Students (independent).","leadTo":[1548.9,1127.5]},{"id":"christadelphians","type":"rect","x":1635.9,"y":1551.4,"w":306.0,"h":46.0,"label":"Christadelphians","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Low church: lay-led 'ecclesias' with no clergy, breaking bread every week.","about":"Founded by John Thomas in the 1840s: lay-led and Bible-only, denying the Trinity and Jesus' existence before his birth.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah raised from the dead, the closed Bible, baptism and the breaking of bread; denies that Jesus existed before his birth or is God, and the Trinity.","leadTo":[1635.9,1127.5]},{"id":"pole-left","type":"text","x":182.6,"y":1198.2,"label":"◀ High church","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"pole-right","type":"text","x":1853.3,"y":1198.2,"label":"Low church ▶","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"mark-0","type":"text","x":359.9,"y":1213.2,"label":"apostolic–\nliturgical","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"mark-1","type":"text","x":794.9,"y":1213.2,"label":"confessional:\nliturgy and\nordered ministry","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"mark-2","type":"text","x":1229.9,"y":1213.2,"label":"believers'\nchurch","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"mark-3","type":"text","x":1621.4,"y":1213.2,"label":"informal,\ncharismatic,\nindependent","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"title","type":"text","x":997.9,"y":77.6,"label":"High church → low church","fontSize":46,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"subtitle","type":"text","x":997.9,"y":131.6,"label":"Top box = Christian religion; edge = heterodox Christian adjacent; bottom box = another religion with Christian roots.","fontSize":22,"textColor":"#1f2b23","fontWeight":"400","z":50,"labelGrow":1.3},{"id":"legend","type":"text","x":997.9,"y":2143.3,"label":"Gold: Catholic · Blue: Orthodox and Eastern\nGreen: Protestant · Red: believers' church\nTeal: holiness, Pentecostal, charismatic\nOlive: Messianic Judaism\nPurple: restorationist in method\n(upright inside Christianity, italic on the\nedge or outside)\nHover a name for its stance; click it for more","fontSize":22,"textColor":"#3b2c14","fontWeight":"400","z":50,"labelGrow":1.3}],"arrows":[],"flat":true}},{"id":"magisterium-revelation","name":"Spectrum: magisterium → personal revelation","about":"Top box = Christian religion; edge = heterodox Christian adjacent; bottom box = another religion with Christian roots.","diagram":{"canvas":{"width":2101,"height":2247},"shapes":[{"id":"christianity","type":"rect","x":1012.3,"y":551.2,"w":1710,"h":687.1,"label":"Christianity","fontSize":34,"stroke":"#1f2b23","fill":"#fdfcf8","textColor":"#1f2b23","strokeWidth":3,"fontWeight":"700","labelDy":-307.7,"z":-1,"note":"Christianity is the one religion of the God of Israel that confesses Jesus of Nazareth as Messiah and risen Lord, distinct from the Father who sent and raised him; receives the Jewish Scriptures and the apostolic writings as a closed canon; and gathers people by baptism and the Lord’s Supper."},{"id":"christian-rooted","type":"rect","x":1012.3,"y":1549.3,"w":1710,"h":627.2,"label":"Christian-rooted movements","fontSize":28,"stroke":"#6a3f8f","fill":"#f6f0f8","textColor":"#6a3f8f","strokeWidth":2.6,"fontWeight":"700","labelDy":-282.0,"z":-1,"note":"Christian rue,"labelGrow":1.25,"note":"Catholic teaching authority in principle, but each group decides for itself which popes or councils to accept.","about":"Groups that keep Catholic worship and bishops but are outside communion with Rome, from the Old Catholics of the 1870s to today's traditionalist groups. Includes: Old Catholic (Union of Utrecht), Polish National Catholic, SSPX (canonically irregular), Sedevacantists, Independent Catholic.","leadTo":[359.8,1001.4]},{"id":"separated-eastern-groups","type":"rect","x":432.3,"y":635.0,"w":180.0,"h":118.0,"label":"Separated\nEastern\ngroups","fontSize":30,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Tradition as it stood before the reforms they reject: the older books and customs are the standard.","about":"Orthodox groups that broke from the main Orthodox churches over reforms: the Old Believers (1650s) and the Old Calendarists (1920s). Includes: True Orthodox (Old Calendarists), Old Believers.","leadTo":[432.3,1001.4]},{"id":"anglican","type":"rect","x":587.9,"y":470.8,"w":162.0,"h":46.0,"label":"Anglican","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture first, read with tradition and reason; bishops and synods teach, and the Thirty-nine Articles and Prayer Book shape belief.","about":"The Church of England and the churches that grew from it: Reformation teaching kept within the older pattern of bishops, liturgy and the Book of Common Prayer. Includes: Church of England, Episcopal Church (US), Anglican Church in North America, Anglican Church of Kenya, Church of Nigeria, Continuing Anglican churches.","leadTo":[577.3,1001.4]},{"id":"lutheran","type":"rect","x":664.3,"y":606.2,"w":162.0,"h":46.0,"label":"Lutheran","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture alone as the final authority, with the Lutheran Confessions (the Book of Concord) as its faithful summary.","about":"Churches from Martin Luther's reformation (1517): salvation by grace through faith, the Lutheran Confessions, and worship close to the older Western liturgy. Includes: Lutheran Church–Missouri Synod, Evangelical Church in Germany (EKD), Wisconsin Synod (WELS), Mekane Yesus (Ethiopia), Nordic Lutheran churches, ELCA.","leadTo":[664.3,1001.4]},{"id":"reformed-presbyterian-congregational","type":"rect","x":722.3,"y":370.2,"w":270.0,"h":118.0,"label":"Reformed /\nPresbyterian /\nCongregational","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture alone, summed up in confessions (Westminster, Heidelberg) that ministers vow to uphold, with church courts to judge doctrine.","about":"Churches from the Swiss and Scottish reformations (Zwingli, Calvin, Knox): God's sovereignty, the Reformed confessions, and churches governed by elders. Includes: United Church of Christ, Presbyterian Church in America, Orthodox Presbyterian, Reformed Church in America, Christian Reformed Church, Church of Scotland, PC(USA).","leadTo":[722.3,1001.4]},{"id":"methodist-wesleyan","type":"rect","x":809.3,"y":792.7,"w":216.0,"h":82.0,"label":"Methodist /\nWesleyan","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture first, with tradition, reason and experience (the 'Wesleyan quadrilateral'); conferences set doctrine.","about":"Churches from John and Charles Wesley's revival in the 1700s Church of England: grace offered to all, holy living, and churches joined in conferences. Includes: United Methodist, Global Methodist, African Methodist Episcopal, AME Zion.","leadTo":[809.3,1001.4]},{"id":"united-uniting-churches","type":"rect","x":795.9,"y":506.2,"w":162.0,"h":118.0,"label":"United &\nUniting\nchurches","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture and the historic creeds, with broad statements of union rather than detailed confessions.","about":"Churches formed in the 1900s by merging several Protestant traditions into one. Includes: Uniting Church in Australia, United Church of Canada, Church of South India, Church of North India.","leadTo":[780.3,1001.4]},{"id":"pre-reformation-churches","type":"rect","x":895.9,"y":692.7,"w":288.0,"h":82.0,"label":"Pre-Reformation\nchurches","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture as the rule of life; the Moravians stress heart religion and decisions made together.","about":"Reform movements older than Luther: the Waldensians (1100s) and the Moravians, from the followers of Jan Hus (1400s). Includes: Waldensian Evangelical, Moravian Church.","leadTo":[896.3,1001.4]},{"id":"adventist","type":"rect","x":949.9,"y":610.7,"w":180.0,"h":46.0,"label":"Adventist","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture alone as the test of doctrine, with Ellen G. White's writings as inspired guidance; the General Conference sets the fundamental beliefs.","about":"From the Millerite movement of the 1840s: waiting for Christ's return and keeping the seventh-day Sabbath. Seventh-day Adventists see Ellen G. White as a prophet whose writings guide but don't add to Scripture. Includes: Seventh-day Adventist, Advent Christian Church.","leadTo":[954.3,1001.4]},{"id":"anabaptist","type":"rect","x":1041.3,"y":482.7,"w":198.0,"h":46.0,"label":"Anabaptist","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture read together by the gathered congregation, which discerns and disciplines; no creed imposed from outside.","about":"The 'radical Reformation' of the 1520s: baptism of believers, nonviolence, and churches separate from the state. Mennonites, Amish, Hutterites and Brethren. Includes: Mennonite, Amish, Hutterite, Church of the Brethren.","leadTo":[1041.3,1001.4]},{"id":"stone-campbell-restoration-movement","type":"rect","x":1099.3,"y":382.7,"w":270.0,"h":118.0,"label":"Stone-Campbell\nRestoration\nMovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"'No creed but Christ, no book but the Bible': believers and congregations read the New Testament pattern directly, without councils or confessions.","about":"The American Restoration Movement of the early 1800s (Barton W. Stone, Alexander Campbell): no creed but the Bible, aiming to restore the New Testament church, with believers baptized by immersion. Churches of Christ, Christian Churches and the Disciples of Christ. Includes: Churches of Christ (a cappella), Christian Church (Disciples of Christ), Christian Churches & Churches of Christ, International Churches of Christ.","leadTo":[1099.3,1001.4]},{"id":"baptist","type":"rect","x":1157.9,"y":610.7,"w":144.0,"h":46.0,"label":"Baptist","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture alone and 'soul competency': each believer and congregation answers to Christ through Scripture; confessions are voluntary.","about":"Churches that baptize believers only, by immersion, with each congregation governing itself. From the English Separatists of the early 1600s. Includes: Southern Baptist Convention, American Baptist Churches USA, National Baptist Convention, Cooperative Baptist Fellowship, Free Will Baptist, Reformed Baptist, Independent Baptist, Seventh Day Baptist.","leadTo":[1157.3,1001.4]},{"id":"nondenominational","type":"rect","x":1247.9,"y":546.7,"w":324.0,"h":46.0,"label":"Nondenominational","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture as read by the believer and the local church, usually with a short statement of faith.","about":"Independent evangelical churches and networks outside the historic denominations, usually with believers' baptism and informal worship. Includes: Nondenominational evangelical, Calvary Chapel.","leadTo":[1244.3,1001.4]},{"id":"holiness","type":"rect","x":1360.3,"y":482.8,"w":162.0,"h":46.0,"label":"Holiness","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture, with great weight on the Spirit's inward witness and the experience of being made holy.","about":"The 1800s holiness movement that grew out of Methodism: a second work of grace that makes believers holy (entire sanctification). The Nazarenes, the Salvation Army and the Wesleyan Church. Includes: Church of the Nazarene, Salvation Army, Wesleyan Church, Free Methodist, Church of God (Anderson).","leadTo":[1360.3,1001.4]},{"id":"other-free-churches","type":"rect","x":1505.3,"y":400.9,"w":198.0,"h":82.0,"label":"Other free\nchurches","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"The Quakers look to the 'inner light', God speaking in each person, tested by the meeting; the Brethren read Scripture together without clergy.","about":"The Quakers (Friends, from the 1650s) and the Plymouth Brethren (1820s: assemblies led by laymen). Unprogrammed Friends wait on the 'inner light' without clergy or sacraments; programmed Friends have pastors and services much like low-church Protestants. Includes: Quakers (Friends), Plymouth Brethren.","leadTo":[1505.3,1001.4]},{"id":"pentecostal","type":"rect","x":1563.9,"y":547.2,"w":216.0,"h":46.0,"label":"Pentecostal","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture as the final authority, alongside prophecy, words of knowledge and the Spirit's leading today.","about":"The movement from the Azusa Street revival (1906): baptism in the Holy Spirit, speaking in tongues, healing and prophecy for today. Includes: Assemblies of God, Church of God in Christ, Church of God (Cleveland), Foursquare Church, Redeemed Christian Church of God.","leadTo":[1563.3,1001.4]},{"id":"charismatic","type":"rect","x":1664.8,"y":483.2,"w":216.0,"h":46.0,"label":"Charismatic","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Scripture, plus prophecy and personal leading by the Spirit today, usually weighed by church leaders.","about":"Pentecostal-style gifts of the Spirit in independent churches and within older churches, from the 1960s on. Includes: Vineyard, Independent charismatic churches.","leadTo":[1664.8,1001.4]},{"id":"african-initiated-churches","type":"rect","x":1534.3,"y":647.2,"w":180.0,"h":118.0,"label":"African\ninitiated\nchurches","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Prophet-founders and their successors lead, and dreams, visions and prophecy guide both the church and its members.","about":"Churches founded by Africans outside the missionary denominations since the late 1800s: the 'Zionist' churches of southern Africa, the Aladura ('praying people') churches of Nigeria, the Kimbanguists of Congo and others, with tens of millions of members. Prophecy, healing and white robes are common; beliefs vary, and a few give their founders exalted roles that other churches question. Includes: Zion Christian Church, Kimbanguist Church, Celestial Church of Christ, Cherubim & Seraphim, Church of the Lord (Aladura).","leadTo":[1534.3,1001.4]},{"id":"community-of-christ","type":"rect","x":722.3,"y":894.7,"w":234.0,"h":82.0,"label":"Community of\nChrist","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"A prophet-president still brings 'inspired counsel', but the World Conference votes before it is added to the Doctrine and Covenants; in practice the church now governs itself much like a mainline denomination.","about":"Formerly the Reorganized Church of Jesus Christ of Latter Day Saints (1860), led by Joseph Smith's descendants until 1996. Since the 1990s and 2000s it has affirmed the Trinity, ordained women, and stopped treating the Book of Mormon as a test of faith, and it now sits much closer to mainline Protestantism than to the LDS Church.","edgeNote":"Christian-adjacent, but denies core tenets. Now accepts the Trinity, Jesus as risen Lord, baptism and communion; keeps an open canon (the Doctrine and Covenants still grows, and the Book of Mormon stays in use).","leadTo":[722.3,1001.4]},{"id":"oneness-pentecostal","type":"rect","x":1037.3,"y":894.7,"w":216.0,"h":82.0,"label":"Oneness\nPentecostal","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"The Bible alone, as set out in the church's Articles of Faith, which ministers must affirm; the UPCI's ministerial boards set doctrine and standards. The Spirit's leading and tongues are stressed, but within that written confession.","about":"Pentecostals who left the Assemblies of God in 1916 over the doctrine of God (the 'New Issue'); today mainly the United Pentecostal Church International and the Pentecostal Assemblies of the World. Includes: United Pentecostal Church Int'l, Pentecostal Assemblies of the World.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah and risen Lord (fully God), the closed Bible, baptism and the Lord's Supper; denies that the Son is distinct from the Father, and so the Trinity.","leadTo":[867.3,1001.4]},{"id":"messianic-judaism","type":"rect","x":1325.3,"y":894.7,"w":180.0,"h":82.0,"label":"Messianic\nJudaism","fontSize":30,"stroke":"#5f6b1f","fill":"transparent","strokeWidth":0,"textColor":"#5f6b1f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Scripture (the Hebrew Bible and the New Testament) read by each congregation, with evangelical statements of faith and no central authority.","about":"Congregations of Jewish (and non-Jewish) believers in Jesus (Yeshua) as the Messiah that keep Jewish practice: the Sabbath, the festivals and Hebrew liturgy, with evangelical, Nicene belief about Christ. It grew from the 1960s and 70s; most Jewish bodies don't regard it as Judaism.","edgeNote":"Christian-adjacent, but differs in core practices. Accepts every core tenet (Nicene faith in Yeshua, the whole Bible, baptism and the Lord's Supper); keeps Torah practice (the Sabbath, the festivals, often kosher food) and a Jewish identity.","leadTo":[1186.3,1001.4]},{"id":"bible-student-movement","type":"rect","x":345.3,"y":1345.9,"w":252.0,"h":82.0,"label":"Bible Student\nmovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Jehovah's Witnesses are taught that their Governing Body is the 'faithful and discreet slave', giving the only correct understanding of Scripture.","about":"From Charles Taze Russell's Bible study movement of the 1870s. Jehovah's Witnesses, led by a Governing Body, are by far the largest part; independent Bible Students keep Russell's older ways. Includes: Jehovah's Witnesses, Bible Students (independent).","leadTo":[345.3,1040.0]},{"id":"iglesia-ni-cristo","type":"rect","x":403.3,"y":1781.9,"w":198.0,"h":82.0,"label":"Iglesia ni\nCristo","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"The Executive Minister and the church administration teach with authority; Felix Manalo is God's last messenger.","about":"Founded in the Philippines in 1914 by Felix Manalo, seen as God's last messenger. Jesus is the Son of God but not God.","leadTo":[403.3,1040.0]},{"id":"latter-day-saint-movement","type":"rect","x":490.3,"y":1463.9,"w":198.0,"h":118.0,"label":"Latter Day\nSaint\nmovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"A living prophet and apostles lead the church by continuing revelation, and members seek personal revelation too.","about":"Founded by Joseph Smith in 1830. Adds the Book of Mormon and other scripture and is led by living prophets and apostles. The Church of Jesus Christ of Latter-day Saints is by far the largest body. (Community of Christ, the second largest, has moved away and is shown on its own.) Includes: Church of Jesus Christ of Latter-day Saints, Church of Christ (Temple Lot), The Church of Jesus Christ (Bickertonite), Remnant Church, FLDS Church, Strangite Church.","leadTo":[490.3,1040.0]},{"id":"unification-church","type":"rect","x":542.3,"y":1681.9,"w":216.0,"h":82.0,"label":"Unification\nChurch","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Sun Myung Moon's teaching, the Divine Principle, is the authoritative completion of the Bible's message.","about":"Founded by Sun Myung Moon in Korea (1954), whom members see as the messiah completing Christ's mission. Now the Family Federation for World Peace and Unification.","leadTo":[548.3,1040.0]},{"id":"armstrong-line-churches-of-god","type":"rect","x":606.3,"y":1581.9,"w":288.0,"h":82.0,"label":"Armstrong-line\nChurches of God","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Government from the top: leaders define doctrine, following the 'restored truths' Armstrong taught.","about":"Only the non-Trinitarian successors of Herbert W. Armstrong's Worldwide Church of God: the United Church of God, the Living Church of God and others that left when the WCG became Trinitarian in the 1990s. The WCG itself, now Grace Communion International, is an evangelical Protestant church. Includes: United Church of God, Living Church of God.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the Bible and Jesus as the divine Son, distinct from the Father, with baptism; denies the Trinity (the Spirit is God's power), keeps a yearly Passover in place of the Lord's Supper, and teaches believers will become God-beings.","leadTo":[606.3,1040.0]},{"id":"christian-science","type":"rect","x":786.3,"y":1681.9,"w":180.0,"h":82.0,"label":"Christian\nScience","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Mary Baker Eddy's Science and Health, read with the Bible, is the church's textbook and 'pastor'.","about":"Founded by Mary Baker Eddy (1879): God is divine Mind, and sickness and matter are finally unreal. Her Science and Health is read alongside the Bible.","leadTo":[780.3,1040.0]},{"id":"swedenborgian","type":"rect","x":838.3,"y":1345.9,"w":252.0,"h":82.0,"label":"Swedenborgian\n(New Church)","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Swedenborg's writings, received as revelation, explain the inner meaning of Scripture.","about":"Follows the visions of Emanuel Swedenborg (1700s): Jesus is the one God, and Swedenborg's writings reveal the inner meaning of Scripture.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts Jesus as God, baptism and communion; denies that the Father and Son are distinct persons, and the closed canon (Swedenborg's writings reveal Scripture's inner meaning).","leadTo":[838.3,1040.0]},{"id":"christadelphians","type":"rect","x":1128.3,"y":1427.7,"w":306.0,"h":46.0,"label":"Christadelphians","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"The Bible alone, read by every member, with a shared Statement of Faith as the basis of fellowship.","about":"Founded by John Thomas in the 1840s: lay-led and Bible-only, denying the Trinity and Jesus' existence before his birth.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah raised from the dead, the closed Bible, baptism and the breaking of bread; denies that Jesus existed before his birth or is God, and the Trinity.","leadTo":[1128.3,1040.0]},{"id":"unitarian-universalism","type":"rect","x":1679.3,"y":1373.9,"w":234.0,"h":82.0,"label":"Unitarian\nUniversalism","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"No creed: each person's reason, conscience and experience, in a free search for truth.","about":"Grew from the Unitarian and Universalist churches of New England. Now a faith without a creed, where members search for truth freely; most don't identify as Christian.","leadTo":[1679.3,1040.0]},{"id":"pole-left","type":"text","x":182.6,"y":1110.7,"label":"◀ Magisterium","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"pole-right","type":"text","x":1836.5,"y":1110.7,"label":"Personal revelation ▶","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"mark-0","type":"text","x":359.8,"y":1125.7,"label":"a teaching office\ndefines the faith","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"mark-1","type":"text","x":722.3,"y":1125.7,"label":"creeds and\nconfessions","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"mark-2","type":"text","x":1157.3,"y":1125.7,"label":"Scripture and\nthe believer's\nconscience","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"mark-3","type":"text","x":1621.3,"y":1125.7,"label":"the Spirit's\nleading and\nprophecy","fontSize":26,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"title","type":"text","x":1012.3,"y":77.6,"label":"Magisterium → personal revelation","fontSize":46,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"subtitle","type":"text","x":1012.3,"y":131.6,"label":"Top box = Christian religion; edge = heterodox Christian adjacent; bottom box = another religion with Christian roots.","fontSize":22,"textColor":"#1f2b23","fontWeight":"400","z":50,"labelGrow":1.3},{"id":"legend","type":"text","x":1012.3,"y":2091.8,"label":"Gold: Catholic · Blue: Orthodox and Eastern\nGreen: Protestant · Red: believers' church\nTeal: holiness, Pentecostal, charismatic\nOlive: Messianic Judaism\nPurple: restorationist in method\n(upright inside Christianity, italic on the\nedge or outside)\nHover a name for its stance; click it for more","fontSize":22,"textColor":"#3b2c14","fontWeight":"400","z":50,"labelGrow":1.3}],"arrows":[],"flat":true}},{"id":"cessation-continuation","name":"Spectrum: cessationist → continuationist","about":"Top box = Christian religion; edge = heterodox Christian adjacent; bottom box = another religion with Christian roots.","diagram":{"canvas":{"width":2094,"height":2307},"shapes":[{"id":"christianity","type":"rect","x":1063.8,"y":616.9,"w":1710,"h":818.6,"label":"Christianity","fontSize":34,"stroke":"#1f2b23","fill":"#fdfcf8","textColor":"#1f2b23","strokeWidth":3,"fontWeight":"700","labelDy":-373.5,"z":-1,"note":"Christianity is the one religion of the God of Israel that confesses Jesus of Nazareth as Messiah and risen Lord, distinct from the Father who sent and raised him; receives the Jewish Scriptures and the apostolic writings as a closed canon; and gathers people by baptism and the Lord’s Supper."},{"id":"christian-rooted","type":"rect","x":1063.8,"y":1644.8,"w":1710,"h":555.2,"label":"Christian-rooted movements","fontSize":28,"stroke":"#6a3f8f","fill":"#f6f0f8","textColor":"#6a3f8f","strokeWidth":2.6,"fontWeight":"700","labelDy":-246.0,"z":-1,"note":"Christian-rooted movements: groups that use Christian language but change the God, the Christ, or the canon.","dashed":true},{"id":"scale","type":"rect","x":1063.8,"y":1152.2,"w":1450,"h":38.6,"label":"","stroke":"none","strokeWidth":0,"fill":"#1f4e9a","gradient":["#1f4e9a","#8ecdf2"],"decor":true,"z":-3},{"id":"scale-frame","type":"image","x":1063.8,"y":1152.2,"w":1471.7,"h":70.0,"href":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABMQAAAA6CAYAAABf5
