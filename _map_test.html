troke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Mostly cessationist: the miraculous gifts confirmed the apostles' message and ended with them (B. B. Warfield); some Reformed charismatics disagree.","about":"Churches from the Swiss and Scottish reformations (Zwingli, Calvin, Knox): God's sovereignty, the Reformed confessions, and churches governed by elders. Includes: United Church of Christ, Presbyterian Church in America, Orthodox Presbyterian, Reformed Church in America, Christian Reformed Church, Church of Scotland, PC(USA).","leadTo":[425.8,1132.9]},{"id":"baptist","type":"rect","x":483.8,"y":766.5,"w":144.0,"h":46.0,"label":"Baptist","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Historically cessationist in most Baptist bodies; today they range from cessationist to 'open but cautious'.","about":"Churches that baptize believers only, by immersion, with each congregation governing itself. From the English Separatists of the early 1600s. Includes: Southern Baptist Convention, American Baptist Churches USA, National Baptist Convention, Cooperative Baptist Fellowship, Free Will Baptist, Reformed Baptist, Independent Baptist, Seventh Day Baptist.","leadTo":[483.8,1132.9]},{"id":"stone-campbell-restoration-movement","type":"rect","x":454.8,"y":566.5,"w":270.0,"h":118.0,"label":"Stone-Campbell\nRestoration\nMovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Most Churches of Christ are cessationist: the Spirit works through the written Word, and the miraculous gifts ended with the apostles.","about":"The American Restoration Movement of the early 1800s (Barton W. Stone, Alexander Campbell): no creed but the Bible, aiming to restore the New Testament church, with believers baptized by immersion. Churches of Christ, Christian Churches and the Disciples of Christ. Includes: Churches of Christ (a cappella), Christian Church (Disciples of Christ), Christian Churches & Churches of Christ, International Churches of Christ.","leadTo":[454.8,1132.9]},{"id":"other-free-churches","type":"rect","x":570.8,"y":684.5,"w":198.0,"h":82.0,"label":"Other free\nchurches","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"The Brethren are firmly cessationist; the Quakers expect the Spirit's direct leading, though not Pentecostal gifts.","about":"The Quakers (Friends, from the 1650s) and the Plymouth Brethren (1820s: assemblies led by laymen). Unprogrammed Friends wait on the 'inner light' without clergy or sacraments; programmed Friends have pastors and services much like low-church Protestants. Includes: Quakers (Friends), Plymouth Brethren.","leadTo":[570.8,1132.9]},{"id":"lutheran","type":"rect","x":831.8,"y":534.2,"w":162.0,"h":46.0,"label":"Lutheran","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Generally cautious: the Spirit works through Word and sacrament; miracles aren't denied, but Pentecostal gifts aren't expected.","about":"Churches from Martin Luther's reformation (1517): salvation by grace through faith, the Lutheran Confessions, and worship close to the older Western liturgy. Includes: Lutheran Church–Missouri Synod, Evangelical Church in Germany (EKD), Wisconsin Synod (WELS), Mekane Yesus (Ethiopia), Nordic Lutheran churches, ELCA.","leadTo":[831.8,1132.9]},{"id":"anabaptist","type":"rect","x":763.3,"y":766.5,"w":198.0,"h":46.0,"label":"Anabaptist","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Mostly cautious: some Mennonite churches are charismatic; the Amish and conservative groups are not.","about":"The 'radical Reformation' of the 1520s: baptism of believers, nonviolence, and churches separate from the state. Mennonites, Amish, Hutterites and Brethren. Includes: Mennonite, Amish, Hutterite, Church of the Brethren.","leadTo":[773.8,1132.9]},{"id":"united-uniting-churches","type":"rect","x":889.8,"y":370.2,"w":162.0,"h":118.0,"label":"United &\nUniting\nchurches","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Varied: seldom stressed in these mainline churches, though the charismatic renewal reached some.","about":"Churches formed in the 1900s by merging several Protestant traditions into one. Includes: Uniting Church in Australia, United Church of Canada, Church of South India, Church of North India.","leadTo":[889.8,1132.9]},{"id":"pre-reformation-churches","type":"rect","x":860.8,"y":680.2,"w":288.0,"h":82.0,"label":"Pre-Reformation\nchurches","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Open but not charismatic: the Moravians stress the Spirit's inward leading.","about":"Reform movements older than Luther: the Waldensians (1100s) and the Moravians, from the followers of Jan Hus (1400s). Includes: Waldensian Evangelical, Moravian Church.","leadTo":[860.8,1132.9]},{"id":"anglican","type":"rect","x":976.8,"y":598.2,"w":162.0,"h":46.0,"label":"Anglican","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Qualified: miracles are possible, and there is a strong charismatic wing (much African Anglicanism, and the Alpha course in Britain).","about":"The Church of England and the churches that grew from it: Reformation teaching kept within the older pattern of bishops, liturgy and the Book of Common Prayer. Includes: Church of England, Episcopal Church (US), Anglican Church in North America, Anglican Church of Kenya, Church of Nigeria, Continuing Anglican churches.","leadTo":[976.8,1132.9]},{"id":"methodist-wesleyan","type":"rect","x":1016.3,"y":844.2,"w":216.0,"h":82.0,"label":"Methodist /\nWesleyan","fontSize":30,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Qualified: Wesley allowed for extraordinary gifts, and Methodism became the root of the holiness and Pentecostal movements.","about":"Churches from John and Charles Wesley's revival in the 1700s Church of England: grace offered to all, holy living, and churches joined in conferences. Includes: United Methodist, Global Methodist, African Methodist Episcopal, AME Zion.","leadTo":[1005.8,1132.9]},{"id":"nondenominational","type":"rect","x":1063.8,"y":470.2,"w":324.0,"h":46.0,"label":"Nondenominational","fontSize":30,"stroke":"#7b2d12","fill":"transparent","strokeWidth":0,"textColor":"#7b2d12","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Mixed: some independent churches are cessationist, many 'open but cautious', others fully charismatic.","about":"Independent evangelical churches and networks outside the historic denominations, usually with believers' baptism and informal worship. Includes: Nondenominational evangelical, Calvary Chapel.","leadTo":[1063.8,1132.9]},{"id":"adventist","type":"rect","x":1121.8,"y":762.2,"w":180.0,"h":46.0,"label":"Adventist","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Continuing prophecy (the gift they see in Ellen White), but wary of tongues and Pentecostal practice.","about":"From the Millerite movement of the 1840s: waiting for Christ's return and keeping the seventh-day Sabbath. Seventh-day Adventists see Ellen G. White as a prophet whose writings guide but don't add to Scripture. Includes: Seventh-day Adventist, Advent Christian Church.","leadTo":[1121.8,1132.9]},{"id":"catholic-church","type":"rect","x":1266.8,"y":534.2,"w":288.0,"h":46.0,"label":"Catholic Church","fontSize":30,"stroke":"#8a6a1f","fill":"transparent","strokeWidth":0,"textColor":"#8a6a1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Continuing in sacrament and saint: miracles through the saints, approved apparitions, sacraments of healing, and a Catholic Charismatic Renewal.","about":"The worldwide communion in union with the Bishop of Rome, the Pope: the Latin Church and 23 Eastern Catholic churches. Its bishops, with the Pope, teach and define the faith from Scripture and Tradition. Includes: Latin Church, Eastern Catholic Churches.","leadTo":[1266.8,1132.9]},{"id":"orthodox-eastern-churches","type":"rect","x":1324.8,"y":906.2,"w":198.0,"h":118.0,"label":"Orthodox &\nEastern\nChurches","fontSize":30,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Continuing in sacrament and saint: wonder-working icons and relics, holy elders, healing through the Church's prayers; wary of Pentecostal-style tongues.","about":"The ancient churches of the East: the Eastern Orthodox communion, the Oriental Orthodox (apart since 451) and the Church of the East. Self-governing churches held together by the councils, the bishops and the liturgy rather than by one head. Includes: Eastern Orthodox, Oriental Orthodox, Church of the East.","leadTo":[1324.8,1132.9]},{"id":"separated-catholic-groups","type":"rect","x":1237.8,"y":634.2,"w":180.0,"h":118.0,"label":"Separated\nCatholic\ngroups","fontSize":30,"stroke":"#8a6a1f","fill":"transparent","strokeWidth":0,"textColor":"#8a6a1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"As Catholic teaching: miracles through saints and sacraments, usually suspicious of charismatic renewal.","about":"Groups that keep Catholic worship and bishops but are outside communion with Rome, from the Old Catholics of the 1870s to today's traditionalist groups. Includes: Old Catholic (Union of Utrecht), Polish National Catholic, SSPX (canonically irregular), Sedevacantists, Independent Catholic.","leadTo":[1237.8,1132.9]},{"id":"separated-eastern-groups","type":"rect","x":1353.8,"y":770.2,"w":180.0,"h":118.0,"label":"Separated\nEastern\ngroups","fontSize":30,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"As the Orthodox: miracles through saints, icons and relics; opposed to Pentecostal practice.","about":"Orthodox groups that broke from the main Orthodox churches over reforms: the Old Believers (1650s) and the Old Calendarists (1920s). Includes: True Orthodox (Old Calendarists), Old Believers.","leadTo":[1353.8,1132.9]},{"id":"holiness","type":"rect","x":1527.8,"y":600.6,"w":162.0,"h":46.0,"label":"Holiness","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Continuationist in spirit: the Spirit's baptism makes believers holy. Many holiness churches became Pentecostal; others, like the Nazarenes, rejected tongues.","about":"The 1800s holiness movement that grew out of Methodism: a second work of grace that makes believers holy (entire sanctification). The Nazarenes, the Salvation Army and the Wesleyan Church. Includes: Church of the Nazarene, Salvation Army, Wesleyan Church, Free Methodist, Church of God (Anderson).","leadTo":[1527.8,1132.9]},{"id":"pentecostal","type":"rect","x":1643.8,"y":664.6,"w":216.0,"h":46.0,"label":"Pentecostal","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Fully continuationist: baptism in the Spirit, shown by speaking in tongues, and healing and prophecy for today.","about":"The movement from the Azusa Street revival (1906): baptism in the Holy Spirit, speaking in tongues, healing and prophecy for today. Includes: Assemblies of God, Church of God in Christ, Church of God (Cleveland), Foursquare Church, Redeemed Christian Church of God.","leadTo":[1643.8,1132.9]},{"id":"charismatic","type":"rect","x":1730.8,"y":536.6,"w":216.0,"h":46.0,"label":"Charismatic","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Fully continuationist: all the gifts for today, without always requiring tongues as the sign.","about":"Pentecostal-style gifts of the Spirit in independent churches and within older churches, from the 1960s on. Includes: Vineyard, Independent charismatic churches.","leadTo":[1730.8,1132.9]},{"id":"african-initiated-churches","type":"rect","x":1687.3,"y":764.6,"w":180.0,"h":118.0,"label":"African\ninitiated\nchurches","fontSize":30,"stroke":"#1f6f78","fill":"transparent","strokeWidth":0,"textColor":"#1f6f78","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"note":"Fully continuationist: healing, prophecy and visions are central, often with holy water and prayer rituals.","about":"Churches founded by Africans outside the missionary denominations since the late 1800s: the 'Zionist' churches of southern Africa, the Aladura ('praying people') churches of Nigeria, the Kimbanguists of Congo and others, with tens of millions of members. Prophecy, healing and white robes are common; beliefs vary, and a few give their founders exalted roles that other churches question. Includes: Zion Christian Church, Kimbanguist Church, Celestial Church of Christ, Cherubim & Seraphim, Church of the Lord (Aladura).","leadTo":[1687.3,1132.9]},{"id":"community-of-christ","type":"rect","x":991.3,"y":1026.2,"w":234.0,"h":82.0,"label":"Community of\nChrist","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Open in a mainline way: continuing revelation through the prophet-president, but no Pentecostal-style gifts in worship.","about":"Formerly the Reorganized Church of Jesus Christ of Latter Day Saints (1860), led by Joseph Smith's descendants until 1996. Since the 1990s and 2000s it has affirmed the Trinity, ordained women, and stopped treating the Book of Mormon as a test of faith, and it now sits much closer to mainline Protestantism than to the LDS Church.","edgeNote":"Christian-adjacent, but denies core tenets. Now accepts the Trinity, Jesus as risen Lord, baptism and communion; keeps an open canon (the Doctrine and Covenants still grows, and the Book of Mormon stays in use).","leadTo":[991.3,1132.9]},{"id":"messianic-judaism","type":"rect","x":1469.8,"y":1026.2,"w":180.0,"h":82.0,"label":"Messianic\nJudaism","fontSize":30,"stroke":"#5f6b1f","fill":"transparent","strokeWidth":0,"textColor":"#5f6b1f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Largely continuationist: much of the movement is charismatic, though some congregations are cautious.","about":"Congregations of Jewish (and non-Jewish) believers in Jesus (Yeshua) as the Messiah that keep Jewish practice: the Sabbath, the festivals and Hebrew liturgy, with evangelical, Nicene belief about Christ. It grew from the 1960s and 70s; most Jewish bodies don't regard it as Judaism.","edgeNote":"Christian-adjacent, but differs in core practices. Accepts every core tenet (Nicene faith in Yeshua, the whole Bible, baptism and the Lord's Supper); keeps Torah practice (the Sabbath, the festivals, often kosher food) and a Jewish identity.","leadTo":[1469.8,1132.9]},{"id":"oneness-pentecostal","type":"rect","x":1757.8,"y":1026.2,"w":216.0,"h":82.0,"label":"Oneness\nPentecostal","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":5,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Fully continuationist: speaking in tongues is the sign of receiving the Spirit, and part of salvation itself.","about":"Pentecostals who left the Assemblies of God in 1916 over the doctrine of God (the 'New Issue'); today mainly the United Pentecostal Church International and the Pentecostal Assemblies of the World. Includes: United Pentecostal Church Int'l, Pentecostal Assemblies of the World.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah and risen Lord (fully God), the closed Bible, baptism and the Lord's Supper; denies that the Son is distinct from the Father, and so the Trinity.","leadTo":[1745.3,1132.9]},{"id":"christadelphians","type":"rect","x":425.8,"y":1459.4,"w":306.0,"h":46.0,"label":"Christadelphians","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Cessationist: the Spirit's gifts ended in the first century.","about":"Founded by John Thomas in the 1840s: lay-led and Bible-only, denying the Trinity and Jesus' existence before his birth.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah raised from the dead, the closed Bible, baptism and the breaking of bread; denies that Jesus existed before his birth or is God, and the Trinity.","leadTo":[425.8,1171.5]},{"id":"bible-student-movement","type":"rect","x":483.8,"y":1841.4,"w":252.0,"h":82.0,"label":"Bible Student\nmovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Cessationist: Jehovah's Witnesses hold that the miraculous gifts ended with the apostles.","about":"From Charles Taze Russell's Bible study movement of the 1870s. Jehovah's Witnesses, led by a Governing Body, are by far the largest part; independent Bible Students keep Russell's older ways. Includes: Jehovah's Witnesses, Bible Students (independent).","leadTo":[483.8,1171.5]},{"id":"armstrong-line-churches-of-god","type":"rect","x":570.8,"y":1541.4,"w":288.0,"h":82.0,"label":"Armstrong-line\nChurches of God","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Gifts aren't sought: the Holy Spirit is God's power rather than a person.","about":"Only the non-Trinitarian successors of Herbert W. Armstrong's Worldwide Church of God: the United Church of God, the Living Church of God and others that left when the WCG became Trinitarian in the 1990s. The WCG itself, now Grace Communion International, is an evangelical Protestant church. Includes: United Church of God, Living Church of God.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts the Bible and Jesus as the divine Son, distinct from the Father, with baptism; denies the Trinity (the Spirit is God's power), keeps a yearly Passover in place of the Lord's Supper, and teaches believers will become God-beings.","leadTo":[570.8,1171.5]},{"id":"iglesia-ni-cristo","type":"rect","x":657.8,"y":1741.4,"w":198.0,"h":82.0,"label":"Iglesia ni\nCristo","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Not charismatic: no tongues or prophecy; authority rests on Manalo's commission.","about":"Founded in the Philippines in 1914 by Felix Manalo, seen as God's last messenger. Jesus is the Son of God but not God.","leadTo":[657.8,1171.5]},{"id":"unitarian-universalism","type":"rect","x":773.8,"y":1641.4,"w":234.0,"h":82.0,"label":"Unitarian\nUniversalism","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Claims no miraculous gifts; many members are naturalists.","about":"Grew from the Unitarian and Universalist churches of New England. Now a faith without a creed, where members search for truth freely; most don't identify as Christian.","leadTo":[773.8,1171.5]},{"id":"swedenborgian","type":"rect","x":1208.8,"y":1577.1,"w":252.0,"h":82.0,"label":"Swedenborgian\n(New Church)","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Swedenborg's own visions of heaven and hell, but no practice of spiritual gifts in the church.","about":"Follows the visions of Emanuel Swedenborg (1700s): Jesus is the one God, and Swedenborg's writings reveal the inner meaning of Scripture.","edgeNote":"Christian-adjacent, but denies core tenets. Accepts Jesus as God, baptism and communion; denies that the Father and Son are distinct persons, and the closed canon (Swedenborg's writings reveal Scripture's inner meaning).","leadTo":[1208.8,1171.5]},{"id":"christian-science","type":"rect","x":1382.8,"y":1477.4,"w":180.0,"h":82.0,"label":"Christian\nScience","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Healing through prayer and understanding God as Mind instead of medicine, but no tongues or prophecy.","about":"Founded by Mary Baker Eddy (1879): God is divine Mind, and sickness and matter are finally unreal. Her Science and Health is read alongside the Bible.","leadTo":[1382.8,1171.5]},{"id":"unification-church","type":"rect","x":1556.8,"y":1613.4,"w":216.0,"h":82.0,"label":"Unification\nChurch","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Revelation and spiritual experiences: Moon's revelations, and spiritual phenomena some members report.","about":"Founded by Sun Myung Moon in Korea (1954), whom members see as the messiah completing Christ's mission. Now the Family Federation for World Peace and Unification.","leadTo":[1556.8,1171.5]},{"id":"latter-day-saint-movement","type":"rect","x":1730.8,"y":1495.4,"w":198.0,"h":118.0,"label":"Latter Day\nSaint\nmovement","fontSize":30,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.25,"italic":true,"note":"Gifts plus new seers: tongues, healing and prophecy, and prophets who receive new scripture.","about":"Founded by Joseph Smith in 1830. Adds the Book of Mormon and other scripture and is led by living prophets and apostles. The Church of Jesus Christ of Latter-day Saints is by far the largest body. (Community of Christ, the second largest, has moved away and is shown on its own.) Includes: Church of Jesus Christ of Latter-day Saints, Church of Christ (Temple Lot), The Church of Jesus Christ (Bickertonite), Remnant Church, FLDS Church, Strangite Church.","leadTo":[1730.8,1171.5]},{"id":"pole-left","type":"text","x":192.8,"y":1242.2,"label":"◀ Cessationist","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"pole-right","type":"text","x":1870.5,"y":1242.2,"label":"Continuationist ▶","fontSize":34,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":
