<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Models of the Christian family</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" />
<style>
/* The diagram map, in accordingtoknowledge.com's parchment colours. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --paper: #e9cb77;
  --paper-deep: #e0bf65;
  --ink: #1f160a;
  --ink-soft: #3b2c14;
  --dim: #6e5628;
  --accent: #7b2d12;
  --line: rgba(70, 45, 10, .32);
  --card: #f6e7bd;
  --ui: "Open Sans", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.dm { display: flex; flex-direction: column; height: 100%; min-height: 320px; background: var(--paper); }
.dm:fullscreen { width: 100vw; height: 100vh; }

/* top bar: model menu, find, list */
.dm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.dm-model { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 220px; }
.dm-cap { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.dm select, .dm input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.dm select { flex: 1; max-width: 100%; font-weight: 600; cursor: pointer; }
.dm-find { flex: 1 1 160px; display: flex; }
.dm-find input { width: 100%; }
.dm-btn { font: inherit; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.dm-btn:hover, .dm-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.dm-about { margin: 0; padding: 6px 12px; font-size: 13.5px; color: var(--ink-soft); border-bottom: 1px solid var(--line); }

/* the map itself */
.dm-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  background: radial-gradient(ellipse at center, #eed48a 0%, var(--paper) 60%, var(--paper-deep) 100%); }
.dm-stage:focus-visible { outline-offset: -3px; }
.dm-stage.dm-dragging { cursor: grabbing; }
.dm-svg { display: block; width: 100%; height: 100%; }
.dm-shape { cursor: zoom-in; transition: stroke-width .15s; }
.dm-shape:hover { filter: brightness(.97); }
.dm-shape.dm-focus { stroke: var(--accent); }
.dm-pulse { animation: dm-pulse 1.4s ease-out 1; }
@keyframes dm-pulse { 0%, 60% { stroke: var(--accent); filter: drop-shadow(0 0 10px rgba(123, 45, 18, .8)); } 100% { filter: none; } }
.dm-label { font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; pointer-events: none;
  paint-order: stroke; stroke: rgba(255, 250, 235, .7); stroke-width: .22em; stroke-linejoin: round; }
.dm-label.dm-text { font-family: var(--ui); stroke: rgba(233, 203, 119, .85); }
/* spectrums: the colour scale, and each name's line to its place on it */
.dm-decor { pointer-events: none; }
.dm-leader { opacity: .22; pointer-events: none; transition: opacity .15s; }
.dm-leader line { stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
.dm-leader.dm-hot { opacity: 1; }
.dm-leader.dm-hot line { stroke-width: 3.5; stroke-dasharray: none; }
.dm-label { transform-box: fill-box; transform-origin: center; transition: transform .15s; }
.dm-label.dm-hot { transform: scale(1.22); font-weight: 800; stroke: #fff1b8; stroke-width: .5em; }
/* family trees: a chosen point of view lights up its line and dims the rest */
.dm-trace { transition: opacity .2s; }
.dm-pov-on .dm-trace:not(.dm-pov-hit) { opacity: .16; }
.dm-pov-on .dm-trace.dm-pov-hit { filter: drop-shadow(0 0 5px rgba(227, 181, 28, .95)); }
.dm-pov-on .dm-label:not(.dm-text):not(.dm-pov-hit) { opacity: .3; }
.dm-pov-on .dm-label.dm-pov-hit { font-weight: 800; }
.dm-pov { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 220px; }
.dm-about.dm-pov-text { background: #fff3c4; color: #1f160a; }
.dm-arrow-label { font-family: var(--ui); paint-order: stroke; stroke: var(--paper); stroke-width: .25em; pointer-events: none; }

/* hover card and hints */
.dm-tip { position: absolute; left: 0; top: 0; max-width: min(320px, 80%); padding: 7px 10px; pointer-events: none; z-index: 3;
  background: var(--ink); color: var(--paper); border-radius: 6px; font-size: 13px; box-shadow: 0 4px 14px rgba(31, 22, 10, .3); }
.dm-tip b { display: block; font-weight: 700; }
.dm-tip span { display: block; opacity: .85; font-size: 12px; margin-top: 2px; }
.dm-hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3; max-width: calc(100% - 24px); text-align: center;
  padding: 6px 12px; border-radius: 999px; background: rgba(31, 22, 10, .86); color: var(--paper); font-size: 13px; pointer-events: none; }

/* zoom buttons */
.dm-zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.dm-zoom button { width: 36px; height: 36px; font: 700 18px/1 var(--ui); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; box-shadow: 0 1px 3px rgba(31, 22, 10, .15); }
.dm-zoom button:hover { background: var(--ink); color: var(--paper); }

/* breadcrumbs */
.dm-crumbs { position: absolute; left: 10px; bottom: 10px; right: 58px; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px;
  font-size: 13px; color: var(--dim); pointer-events: none; }
.dm-crumbs > * { pointer-events: auto; }
.dm-crumbs button { font: inherit; font-weight: 600; color: var(--accent); background: rgba(246, 231, 189, .9); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.dm-crumbs button[aria-current] { color: var(--ink); background: var(--card); }
.dm-crumbs button:hover { text-decoration: underline; }
.dm-note em, .dm-note .dm-about-text { display: block; }
.dm-note em + em, .dm-note .dm-about-text + em { margin-top: 4px; }
.dm-note { flex-basis: 100%; margin-top: 3px; padding: 3px 9px; width: fit-content; max-width: 100%; background: rgba(246, 231, 189, .9); border-radius: 6px; color: var(--ink-soft); }

/* list view */
.dm-list { position: absolute; top: 0; left: 0; bottom: 0; width: min(340px, 88%); overflow: auto; z-index: 4; padding: 10px 8px 16px;
  background: var(--card); border-right: 1px solid var(--line); box-shadow: 4px 0 18px rgba(31, 22, 10, .18); cursor: auto; touch-action: auto; user-select: text; }
.dm-tree, .dm-tree ul { list-style: none; margin: 0; padding: 0; }
.dm-tree ul { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--line); }
.dm-tree button { font: inherit; font-size: 13.5px; text-align: left; color: var(--ink); background: none; border: 0; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
.dm-tree button:hover { background: var(--paper); color: var(--accent); }
.dm-tree > li > button { font-weight: 700; }

/* short frames (an article on a small screen): the map gets the room */
@media (max-height: 470px) { .dm-about { display: none; } }

@media (max-width: 520px) {
  .dm-bar { padding: 6px 8px; }
  .dm-cap { display: none; }
  .dm-about { font-size: 12.5px; }
}

</style>
</head>
<body>
<div id="map"></div>
<noscript><p style="padding:16px">This map needs JavaScript to run.</p></noscript>
<script>
/* The diagram map: a zoomable, draggable map of nested circles, drawn from Diagram Studio's
   .json format (shapes with x, y, r or rx/ry, labels, colours; optional arrows). Used by
   interactives like ../christian-families/.

     DiagramMap.mount(document.getElementById("map"), { models: "models.json" });

   models.json: { "title": "...", "models": [ { "id", "name", "file", "about" } ] }

   Or with everything built in (a single standalone file, see ../build-standalone.py):
     DiagramMap.mount(el, { data: { "title": "...", "models": [ { "id", "name", "about", "diagram": {…} } ] } });

   Which circle is "inside" which is worked out from the geometry, so the breadcrumbs, the
   list view and "straddles the edge of …" come for free with any diagram.

   Extra shape fields Diagram Studio doesn't have: "note" (shown on hover and when zoomed to the
   circle), "labelAlways" (keep the name readable however far out you zoom), and rectangles:
   { "type": "rect", "x", "y" (its centre), "w", "h", … } with the same colours and label fields.
   For spectrums: "gradient": [left colour, right colour] fills a rectangle as a colour scale,
   "decor": true makes a shape scenery (not hoverable, listed or findable), and "leadTo": [x, y]
   draws a thin line from a name to its place on the scale. "about" is what a group is, shown when
   it's chosen (clicked, found or picked from the list), above its "note". A diagram with "flat": true shows
   each name's own note instead of the trail of groups it sits in.
   Pictures: { "type": "image", "x", "y" (centre), "w", "h", "href" } (scenery). "edgeNote" on a shape
   replaces the automatic "Straddles the edge of …" line.
   Family trees: "paths": [{ "id", "d" (an SVG path), "stroke", "width", "dashed", "pov" }] are drawn
   under the names, and "povs": [{ "id", "name", "text", "nodes": [shape ids], "paths": [path ids] }]
   offers a "View as" menu: choosing one lights up that church's line to the apostles and dims the
   rest. Paths and shapes with a "pov" only appear in that view. */
(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const flat = (s) => String(s || "").replace(/\s*\n\s*/g, " ").trim();
  const MIN_LABEL_PX = 10;          // labels smaller than this on screen are hidden (or, for groups, kept at this size)
  const standalone = (() => { try { return window.top === window.self; } catch { return false; } })();
  const el = (tag, attrs = {}) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function mount(root, { models: modelsUrl = "models.json", data = null } = {}) {
    root.classList.add("dm");
    root.innerHTML = `
      <header class="dm-bar">
        <label class="dm-model"><span class="dm-cap">Model</span><select aria-label="Choose a model"></select></label>
        <label class="dm-pov" hidden><span class="dm-cap">View as</span><select aria-label="Whose point of view"></select></label>
        <form class="dm-find" role="search"><input type="search" placeholder="Find…" aria-label="Find a group on the map" list="dm-names" autocomplete="off" /><datalist id="dm-names"></datalist></form>
        <button class="dm-btn" type="button" data-act="list" aria-pressed="false" title="The same map as a list">List</button>
      </header>
      <p class="dm-about"></p>
      <div class="dm-stage" tabindex="0" aria-label="Map. Drag to move, scroll or pinch to zoom, click a circle to zoom into it.">
        <svg class="dm-svg" role="img"><defs></defs><g class="dm-shapes"></g><g class="dm-paths"></g><g class="dm-arrows"></g><g class="dm-leaders"></g><g class="dm-labels"></g></svg>
        <div class="dm-tip" hidden></div>
        <div class="dm-hint" hidden></div>
        <div class="dm-zoom">
          <button type="button" data-act="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
          <button type="button" data-act="out" title="Zoom out (−)" aria-label="Zoom out">−</button>
          <button type="button" data-act="fit" title="Show everything (0)" aria-label="Show everything">⤢</button>
          <button type="button" data-act="full" title="Full screen" aria-label="Full screen">⛶</button>
        </div>
        <nav class="dm-crumbs" aria-label="Where you are"></nav>
        <aside class="dm-list" hidden aria-label="The map as a list"></aside>
      </div>`;
    const $ = (s) => root.querySelector(s);
    const stage = $(".dm-stage"), svg = $(".dm-svg"), gShapes = $(".dm-shapes"), gArrows = $(".dm-arrows"), gLabels = $(".dm-labels"), gLeaders = $(".dm-leaders"), gPaths = $(".dm-paths");
    const povSelect = $(".dm-pov select");
    let povs = [], modelAbout = "";
    const tip = $(".dm-tip"), hint = $(".dm-hint"), crumbs = $(".dm-crumbs"), list = $(".dm-list"), select = $(".dm-model select");

    let models = [], shapes = [], labels = [], content = { x: 0, y: 0, w: 1000, h: 1000 };
    let vb = { x: 0, y: 0, w: 1000, h: 1000 }, focused = -1, anim = null, labelFrame = 0;
    let touched = false;   // until the reader moves the map, it stays fitted to the whole diagram

    /* ───────── the view ───────── */
    const size = () => { const r = stage.getBoundingClientRect(); return { w: Math.max(1, r.width), h: Math.max(1, r.height) }; };
    const scale = () => size().w / vb.w;
    // a view that shows `box` with some room around it, in the stage's shape
    function viewFor(box, pad = 0.08) {
      const s = size(), aspect = s.h / s.w;
      let w = box.w * (1 + pad * 2), h = box.h * (1 + pad * 2);
      if (h / w > aspect) w = h / aspect; else h = w * aspect;
      return { x: box.x + box.w / 2 - w / 2, y: box.y + box.h / 2 - h / 2, w, h };
    }
    function clamp(v) {
      const maxW = content.w * 3, minW = Math.min(content.w, 60);
      const w = Math.min(maxW, Math.max(minW, v.w)), h = w * (v.h / v.w);
      const cx = v.x + v.w / 2, cy = v.y + v.h / 2;
      // keep at least part of the diagram on screen
      const x = Math.min(content.x + content.w - w * 0.15, Math.max(content.x - w * 0.85, cx - w / 2));
      const y = Math.min(content.y + content.h - h * 0.15, Math.max(content.y - h * 0.85, cy - h / 2));
      return { x, y, w, h };
    }
    function apply() {
      svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      if (!labelFrame) labelFrame = requestAnimationFrame(() => { labelFrame = 0; updateLabels(); });
    }
    function setView(next, animate = false) {
      next = clamp(next);
      cancelAnimationFrame(anim);
      if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { vb = next; apply(); return; }
      const from = { ...vb }, t0 = performance.now(), dur = 420;
      const step = (now) => {
        const t = Math.min(1, (now - t0) / dur), k = ease(t);
        // zoom in log space so it feels even
        const w = Math.exp(Math.log(from.w) + (Math.log(next.w) - Math.log(from.w)) * k);
        const cx = from.x + from.w / 2 + (next.x + next.w / 2 - from.x - from.w / 2) * k;
        const cy = from.y + from.h / 2 + (next.y + next.h / 2 - from.y - from.h / 2) * k;
        const h = w * (next.h / next.w);
        vb = { x: cx - w / 2, y: cy - h / 2, w, h };
        apply();
        if (t < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }
    function zoomAt(factor, clientX, clientY, animate = false) {
      const r = stage.getBoundingClientRect(), s = size();
      const fx = clientX == null ? 0.5 : (clientX - r.left) / s.w, fy = clientY == null ? 0.5 : (clientY - r.top) / s.h;
      const px = vb.x + fx * vb.w, py = vb.y + fy * vb.h;
      const w = vb.w / factor, h = vb.h / factor;
      setView({ x: px - fx * w, y: py - fy * h, w, h }, animate);
    }
    const fit = (animate = true) => { setFocus(-1); setView(viewFor(content, 0.03), animate); touched = false; };

    // keep the view the same shape as the stage when it resizes
    new ResizeObserver(() => {
      if (!touched) { cancelAnimationFrame(anim); vb = clamp(viewFor(content, 0.03)); apply(); return; }
      const s = size(); vb = clamp({ ...vb, h: vb.w * (s.h / s.w) }); apply();
    }).observe(stage);

    /* ───────── labels: only the ones big enough to read ─────────
       Group names (circles with others inside) stay readable when zoomed out; the rest appear
       as you zoom in. */
    function updateLabels() {
      const s = scale();
      for (const L of labels) {
        let fontSize = L.base, show = true;
        if (L.base * s < MIN_LABEL_PX) {
          if (L.grow && (L.radius === Infinity || L.radius * s >= (L.always ? 1 : 38))) fontSize = Math.min(MIN_LABEL_PX / s, L.base * L.maxGrow);
          else show = false;
        }
        if (show !== L.shown) { L.node.style.display = show ? "" : "none"; L.shown = show; }
        if (show && fontSize !== L.size) { L.node.setAttribute("font-size", fontSize); L.size = fontSize; }
      }
    }

    /* ───────── building a model ───────── */
    function build(data) {
      const raw = Array.isArray(data.shapes) ? data.shapes : [];
      gShapes.textContent = ""; gArrows.textContent = ""; gLabels.textContent = ""; gLeaders.textContent = ""; gPaths.textContent = ""; svg.querySelector("defs").textContent = "";
      flatModel = !!data.flat; hot = -1;
      shapes = raw.filter((r) => Number.isFinite(+r.x) && Number.isFinite(+r.y)).map((r, i) => {
        const text = r.type === "text", image = r.type === "image", rect = r.type === "rect" || image, rr = Number(r.r) || 70;
        return {
          i, key: String(r.id ?? i), text, rect, x: +r.x, y: +r.y,
          // a rectangle is given by its centre (x, y) and its width and height (w, h)
          image, href: image ? String(r.href || "") : "", pov: r.pov ? String(r.pov) : "", edgeNote: r.edgeNote ? String(r.edgeNote) : "",
          rx: text ? 0 : rect ? (Number(r.w) || 200) / 2 : Number(r.rx) || rr,
          ry: text ? 0 : rect ? (Number(r.h) || 120) / 2 : Number(r.ry) || Number(r.rx) || rr,
          label: r.label != null ? String(r.label) : "", fontSize: Number(r.fontSize) || (text ? 15 : 14),
          stroke: r.stroke || "#1f2b23", fill: r.fill === "#ffffff" ? "#fffaf0" : (r.fill || "#fffaf0"),   // pure white, warmed to sit on parchment
          textColor: r.textColor || "#1f2b23", strokeWidth: r.strokeWidth != null ? Number(r.strokeWidth) : 2.5,
          dashed: !!r.dashed, fillOpacity: r.fillOpacity != null ? Number(r.fillOpacity) : 1,
          fontWeight: r.fontWeight || "600", italic: !!r.italic, labelDx: Number(r.labelDx) || 0, labelDy: Number(r.labelDy) || 0,
          z: Number(r.z) || 0, note: r.note || r.description || "", about: r.about ? String(r.about) : "",
          labelGrow: Number(r.labelGrow) > 0 ? Number(r.labelGrow) : Infinity,
          always: !!r.labelAlways, parent: -1, kids: [], straddles: [],
          decor: !!r.decor || image, gradient: Array.isArray(r.gradient) && r.gradient.length >= 2 ? r.gradient.map(String) : null,
          leadTo: Array.isArray(r.leadTo) && r.leadTo.length === 2 ? r.leadTo.map(Number) : null,
        };
      });
      // nesting: each shape's parent is the smallest shape that fully holds it; one that crosses a
      // bigger one's edge "straddles" it (circles and rectangles alike)
      const circles = shapes.filter((s) => !s.text && !s.decor);
      const R = (s) => Math.max(s.rx, s.ry);
      const area = (s) => (s.rect ? 4 * s.rx * s.ry : Math.PI * s.rx * s.ry);
      const holds = (p, c) => {
        if (p.rect) return c.x - c.rx >= p.x - p.rx - 1 && c.x + c.rx <= p.x + p.rx + 1 && c.y - c.ry >= p.y - p.ry - 1 && c.y + c.ry <= p.y + p.ry + 1;
        if (c.rect) return Math.hypot(Math.abs(c.x - p.x) + c.rx, Math.abs(c.y - p.y) + c.ry) <= R(p) + 1;
        return Math.hypot(p.x - c.x, p.y - c.y) + R(c) <= R(p) + 1;
      };
      const toRect = (b, x, y) => Math.hypot(Math.max(0, Math.abs(x - b.x) - b.rx), Math.max(0, Math.abs(y - b.y) - b.ry));
      const touches = (p, c) => {
        if (p.rect && c.rect) return Math.abs(p.x - c.x) < p.rx + c.rx && Math.abs(p.y - c.y) < p.ry + c.ry;
        if (p.rect) return toRect(p, c.x, c.y) < R(c);
        if (c.rect) return toRect(c, p.x, p.y) < R(p);
        return Math.hypot(p.x - c.x, p.y - c.y) < R(p) + R(c);
      };
      for (const c of circles) {
        let best = null;
        for (const p of circles) {
          if (p === c || area(p) <= area(c)) continue;
          if (holds(p, c)) { if (!best || area(p) < area(best)) best = p; }
          else if (touches(p, c)) c.straddles.push(p.i);
        }
        if (best) { c.parent = best.i; best.kids.push(c.i); }
      }
      // only what's news: not an edge the circle's own group already crosses
      for (const c of circles) c.straddles = c.straddles.filter((j) => j !== c.parent && !ancestors(c.i).includes(j));
      for (const c of circles) if (c.parent >= 0) c.straddles = c.straddles.filter((j) => !shapes[c.parent].straddles.includes(j));

      // content bounds: the canvas, grown to fit every circle
      const cw = Number(data.canvas && data.canvas.width) || 0, ch = Number(data.canvas && data.canvas.height) || 0;
      let x0 = 0, y0 = 0, x1 = cw, y1 = ch;
      for (const s of shapes) {
        const hw = s.text ? Math.max(...s.label.split("\n").map((l) => l.length)) * s.fontSize * 0.3 : s.rx;
        const hh = s.text ? s.label.split("\n").length * s.fontSize * 0.7 : s.ry;
        x0 = Math.min(x0, s.x - hw); x1 = Math.max(x1, s.x + hw); y0 = Math.min(y0, s.y - hh); y1 = Math.max(y1, s.y + hh);
      }
      content = { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) };

      // circles (bottom to top), then arrows, then every label on top so none is covered
      const order = [...shapes].sort((a, b) => a.z - b.z);
      for (const s of order) {
        if (s.text) continue;
        let fill = s.fill;
        if (s.gradient) {   // a colour scale, left to right
          const id = "dm-grad-" + s.i, g = el("linearGradient", { id, x1: "0", x2: "1", y1: "0", y2: "0" });
          s.gradient.forEach((c, k) => g.appendChild(el("stop", { offset: String(k / (s.gradient.length - 1)), "stop-color": c })));
          svg.querySelector("defs").appendChild(g);
          fill = `url(#${id})`;
        }
        const look = s.decor ? { fill, stroke: s.stroke, "stroke-width": s.strokeWidth, class: "dm-decor" }
          : { fill, stroke: s.stroke, "stroke-width": s.strokeWidth, "data-i": s.i, class: "dm-shape" };
        const e = s.image
          ? el("image", { href: s.href, x: s.x - s.rx, y: s.y - s.ry, width: s.rx * 2, height: s.ry * 2, preserveAspectRatio: "none", class: "dm-decor" })
          : s.rect
            ? el("rect", { x: s.x - s.rx, y: s.y - s.ry, width: s.rx * 2, height: s.ry * 2, rx: 22, ...look })
            : el("ellipse", { cx: s.x, cy: s.y, rx: s.rx, ry: s.ry, ...look });
        if (s.pov) e.setAttribute("data-pov", s.pov);
        if (s.dashed) e.setAttribute("stroke-dasharray", "8 5");
        if (s.fillOpacity < 1) e.setAttribute("fill-opacity", s.fillOpacity);
        s.node = e;
        gShapes.appendChild(e);
      }
      drawArrows(data.arrows || []);
      for (const p of Array.isArray(data.paths) ? data.paths : []) {
        const e = el("path", { d: String(p.d || ""), fill: "none", stroke: p.stroke || "#1f2b23", "stroke-width": Number(p.width) || 3,
          "stroke-linecap": "round", "stroke-linejoin": "round", class: "dm-trace", "data-path": String(p.id || "") });
        if (p.dashed) e.setAttribute("stroke-dasharray", typeof p.dashed === "string" ? p.dashed : "2 9");
        if (p.pov) e.setAttribute("data-pov", String(p.pov));
        gPaths.appendChild(e);
      }
      // leader lines: from a name down or up to its place on the scale
      for (const s of shapes) {
        if (!s.leadTo) continue;
        const [lx, ly] = s.leadTo, fromY = ly < s.y ? s.y - s.ry : s.y + s.ry;
        const g = el("g", { class: "dm-leader" });
        g.appendChild(el("line", { x1: s.x, y1: fromY, x2: lx, y2: ly, stroke: s.textColor }));
        g.appendChild(el("circle", { cx: lx, cy: ly, r: 7, fill: s.textColor }));
        gLeaders.appendChild(g);
        s.leader = g;
      }
      labels = [];
      for (const s of order) {
        if (!s.label) continue;
        const lines = s.label.split("\n");
        const t = el("text", { x: s.x + s.labelDx, y: s.y + s.labelDy, "text-anchor": "middle", "dominant-baseline": "middle",
          fill: s.textColor, "font-size": s.fontSize, "font-weight": s.fontWeight, class: "dm-label" + (s.text ? " dm-text" : ""), "data-i": s.i });
        if (s.italic) t.setAttribute("font-style", "italic");
        lines.forEach((ln, k) => {
          const ts = el("tspan", { x: s.x + s.labelDx, dy: k ? "1.2em" : `${-(lines.length - 1) * 0.6}em` });
          ts.textContent = ln;
          t.appendChild(ts);
        });
        if (s.pov) t.setAttribute("data-pov", s.pov);
        gLabels.appendChild(t);
        s.labelNode = t;
        const longest = Math.max(...lines.map((l) => l.length));
        labels.push({ node: t, base: s.fontSize, radius: s.text ? Infinity : s.rect ? Math.min(s.rx, s.ry) : R(s), grow: s.text ? longest <= 60 : s.kids.length > 0 || s.always,
          always: s.always, shown: true, size: s.fontSize, maxGrow: s.labelGrow });
      }
      svg.setAttribute("aria-label", data.title || "Diagram");
      // points of view
      povs = Array.isArray(data.povs) ? data.povs : [];
      povSelect.innerHTML = `<option value="">Everyone (no point of view)</option>` + povs.map((v) => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
      $(".dm-pov").hidden = !povs.length;
      applyPov("");
      buildList(); buildNames();
      focused = -1; renderCrumbs();
    }

    function drawArrows(arrows) {
      const byKey = new Map(shapes.map((s) => [s.key, s]));
      const defs = svg.querySelector("defs"), colors = new Set();
      for (const a of arrows) {
        const f = byKey.get(String(a.from)), t = byKey.get(String(a.to));
        if (!f || !t) continue;
        const color = a.color || "#7a3b2e", id = "dm-m" + color.replace(/[^0-9a-z]/gi, "");
        if (!colors.has(color)) {
          colors.add(color);
          for (const dir of ["end", "start"]) {
            const m = el("marker", { id: `${id}-${dir}`, viewBox: "0 0 10 10", refX: dir === "end" ? 8.5 : 1.5, refY: 5, markerWidth: 8, markerHeight: 8, orient: dir === "end" ? "auto" : "auto-start-reverse" });
            m.appendChild(el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }));
            defs.appendChild(m);
          }
        }
        const edge = (s, dx, dy) => { if (!dx && !dy) return { x: s.x, y: s.y }; const k = 1 / Math.sqrt((dx / (s.rx || 1)) ** 2 + (dy / (s.ry || 1)) ** 2); return { x: s.x + dx * k, y: s.y + dy * k }; };
        const dx = t.x - f.x, dy = t.y - f.y, p1 = edge(f, dx, dy), p2 = edge(t, -dx, -dy);
        let cx = (p1.x + p2.x) / 2, cy = (p1.y + p2.y) / 2;
        const curve = Number(a.curvature) || 0;
        if (curve) { const len = Math.hypot(dx, dy) || 1; cx += (-dy / len) * curve; cy += (dx / len) * curve; }
        const path = el("path", { d: curve ? `M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}` : `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`,
          stroke: color, "stroke-width": 2.5, fill: "none", class: "dm-arrow" });
        if (a.dashed) path.setAttribute("stroke-dasharray", "7 5");
        if (a.arrowEnd !== false) path.setAttribute("marker-end", `url(#${id}-end)`);
        if (a.arrowStart) path.setAttribute("marker-start", `url(#${id}-start)`);
        gArrows.appendChild(path);
        if (a.label) {
          const t2 = el("text", { x: cx, y: cy, "text-anchor": "middle", "dominant-baseline": "middle", fill: color, "font-size": Number(a.fontSize) || 12, class: "dm-arrow-label" });
          t2.textContent = a.label;
          gArrows.appendChild(t2);
        }
      }
    }

    /* ───────── where a circle sits ───────── */
    function ancestors(i) {
      const out = [];
      for (let p = shapes[i] ? shapes[i].parent : -1; p >= 0; p = shapes[p].parent) out.unshift(p);
      return out;
    }
    let flatModel = false, hot = -1;
    const hinted = new Set();   // models whose how-to hint has been shown
    // the name under the pointer (or chosen): highlighted, a little bigger and in front, with its line
    function setHot(i) {
      if (i === hot) return;
      const old = shapes[hot];
      if (old) { old.labelNode?.classList.remove("dm-hot"); old.leader?.classList.remove("dm-hot"); }
      hot = i;
      const s = shapes[i];
      if (!s || s.text || s.decor) return;
      if (s.labelNode) { s.labelNode.classList.add("dm-hot"); gLabels.appendChild(s.labelNode); }
      if (s.leader) { s.leader.classList.add("dm-hot"); gLeaders.appendChild(s.leader); }
    }
    const pathText = (i) => [...ancestors(i), i].map((j) => flat(shapes[j].label)).join(" › ");
    const straddleText = (i) => (!shapes[i].straddles.length ? "" : shapes[i].edgeNote
      || `Straddles the edge of ${shapes[i].straddles.map((j) => flat(shapes[j].label)).join(", ")}`);
    // a point of view: its line lights up, the rest dims, and its account replaces the description line
    function applyPov(id) {
      const v = povs.find((x) => x.id === id) || null;
      povSelect.value = v ? v.id : "";
      svg.classList.toggle("dm-pov-on", !!v);
      const nodes = new Set(v ? v.nodes || [] : []), paths = new Set(v ? v.paths || [] : []);
      svg.querySelectorAll(".dm-pov-hit").forEach((e) => e.classList.remove("dm-pov-hit"));
      svg.querySelectorAll("[data-pov]").forEach((e) => { e.style.display = v && e.getAttribute("data-pov") === v.id ? "" : "none"; });
      gPaths.querySelectorAll("path").forEach((e) => { if (paths.has(e.getAttribute("data-path")) || e.getAttribute("data-pov")) e.classList.add("dm-pov-hit"); });
      for (const s of shapes) if (nodes.has(s.key) || (v && s.pov === v.id)) { s.labelNode?.classList.add("dm-pov-hit"); s.node?.classList.add("dm-pov-hit"); }
      $(".dm-about").textContent = v ? v.text : modelAbout;
      $(".dm-about").classList.toggle("dm-pov-text", !!v);
      $(".dm-about").hidden = !(v ? v.text : modelAbout);
    }
    povSelect.addEventListener("change", () => applyPov(povSelect.value));

    function renderCrumbs() {
      const trail = focused >= 0 ? (flatModel ? [focused] : [...ancestors(focused), focused]) : [];
      crumbs.innerHTML = `<button type="button" data-crumb="-1">Everything</button>`
        + trail.map((j) => ` <span aria-hidden="true">›</span> <button type="button" data-crumb="${j}"${j === focused ? ' aria-current="true"' : ""}>${esc(flat(shapes[j].label) || "Unnamed")}</button>`).join("")
        + (focused >= 0 && (shapes[focused].about || shapes[focused].note || shapes[focused].straddles.length)
          ? `<span class="dm-note">${shapes[focused].about ? `<span class="dm-about-text">${esc(shapes[focused].about)}</span>` : ""}${
            [shapes[focused].note, straddleText(focused)].filter(Boolean).map((t) => `<em>${esc(t)}</em>`).join("")}</span>` : "");
    }
    function setFocus(i) {
      if (focused >= 0 && shapes[focused] && shapes[focused].node) shapes[focused].node.classList.remove("dm-focus");
      focused = i;
      if (i >= 0 && shapes[i].node) shapes[i].node.classList.add("dm-focus");
      setHot(i);
      renderCrumbs();
    }
    function focus(i, pulse = false) {
      const s = shapes[i];
      if (!s) return;
      setFocus(s.text ? -1 : i);
      touched = true;
      const box = s.text ? { x: s.x - 200, y: s.y - 60, w: 400, h: 120 } : { x: s.x - s.rx, y: s.y - s.ry, w: s.rx * 2, h: s.ry * 2 };
      // never closer than about 560 units across, so a small name or circle comes with its neighbours
      const grow = (b, min) => (b.w >= min ? b : { x: b.x - (min - b.w) / 2, y: b.y - (min * b.h / b.w - b.h) / 2, w: min, h: min * b.h / b.w });
      setView(viewFor(grow(box, 560), 0.12), true);
      if (pulse && s.node) { s.node.classList.remove("dm-pulse"); void s.node.getBBox(); s.node.classList.add("dm-pulse"); }
    }

    /* ───────── the list view and "find" ───────── */
    function buildList() {
      const item = (s) => `<li><button type="button" data-go="${s.i}">${esc(flat(s.label) || "Unnamed")}</button>${s.kids.length
        ? `<ul>${s.kids.map((k) => shapes[k]).sort((a, b) => a.y - b.y || a.x - b.x).map(item).join("")}</ul>` : ""}</li>`;
      const tops = shapes.filter((s) => !s.text && !s.decor && s.parent < 0).sort((a, b) => b.rx * b.ry - a.rx * a.ry);
      list.innerHTML = `<ul class="dm-tree">${tops.map(item).join("")}</ul>`;
    }
    function buildNames() {
      const names = [...new Set(shapes.filter((s) => !s.text && !s.decor && s.label).map((s) => flat(s.label)))].sort((a, b) => a.localeCompare(b));
      $("#dm-names").innerHTML = names.map((n) => `<option value="${esc(n)}">`).join("");
    }
    let lastFind = { q: "", k: -1 };
    $(".dm-find").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = flat($(".dm-find input").value).toLowerCase();
      if (!q) return;
      const cands = shapes.filter((s) => !s.text && !s.decor && s.label);
      const name = (s) => flat(s.label).toLowerCase();
      const words = (s) => `${s.about} ${s.note}`.toLowerCase();
      const hits = [
        ...cands.filter((s) => name(s) === q), ...cands.filter((s) => name(s) !== q && name(s).includes(q)),
        ...cands.filter((s) => !name(s).includes(q) && words(s).includes(q)),
      ];
      if (!hits.length) { showHint(`Nothing on this map mentions “${$(".dm-find input").value}”.`); return; }
      const k = lastFind.q === q ? (lastFind.k + 1) % hits.length : 0;
      lastFind = { q, k };
      const hit = hits[k];
      focus(hit.i, true);
      const more = hits.length > 1 ? ` (${k + 1} of ${hits.length}: press Enter for the next)` : "";
      if (!name(hit).includes(q)) showHint(`Found in the description of ${flat(hit.label)}${more}`);
      else if (more) showHint(`${flat(hit.label)}${more}`);
    });
    $(".dm-find input").addEventListener("change", () => $(".dm-find").requestSubmit());

    /* ───────── controls ───────── */
    root.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.crumb != null) { const j = +b.dataset.crumb; if (j < 0) fit(); else focus(j); return; }
      if (b.dataset.go != null) { focus(+b.dataset.go, true); if (size().w < 640) toggleList(false); return; }
      if (b.dataset.act === "in" || b.dataset.act === "out") touched = true;
      switch (b.dataset.act) {
        case "in": zoomAt(1.6, null, null, true); break;
        case "out": zoomAt(1 / 1.6, null, null, true); break;
        case "fit": fit(); break;
        case "list": toggleList(); break;
        case "full": {
          const d = document;
          if (d.fullscreenElement) d.exitFullscreen(); else (root.requestFullscreen || root.webkitRequestFullscreen)?.call(root);
          break;
        }
      }
    });
    function toggleList(on) {
      const show = on == null ? list.hidden : on;
      list.hidden = !show;
      $('[data-act="list"]').setAttribute("aria-pressed", String(show));
    }
    let hintTimer = 0;
    function showHint(text, ms = 2600) {
      hint.textContent = text; hint.hidden = false;
      clearTimeout(hintTimer); hintTimer = setTimeout(() => { hint.hidden = true; }, ms);
    }

    /* ───────── pointer: drag to move, pinch to zoom, click a circle to zoom into it ───────── */
    const pts = new Map();
    let drag = null, engaged = standalone;
    stage.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button, .dm-list, .dm-crumbs")) return;
      engaged = true;
      stage.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false, target: e.target };
      else drag = null;
      cancelAnimationFrame(anim);
      tip.hidden = true;
    });
    stage.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId)) { hover(e); return; }
      const prev = pts.get(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2) {   // pinch
        const [a, b] = [...pts.values()], old = [...pts.entries()].map(([id, p]) => (id === e.pointerId ? prev : p));
        const d1 = Math.hypot(a.x - b.x, a.y - b.y), d0 = Math.hypot(old[0].x - old[1].x, old[0].y - old[1].y);
        touched = true;
        if (d0 > 0) zoomAt(d1 / d0, (a.x + b.x) / 2, (a.y + b.y) / 2);
        return;
      }
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true;
      touched = true;
      stage.classList.add("dm-dragging");
      const s = size().w / drag.vb.w;
      setView({ ...drag.vb, x: drag.vb.x - dx / s, y: drag.vb.y - dy / s });
    });
    const end = (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.delete(e.pointerId);
      stage.classList.remove("dm-dragging");
      if (drag && !drag.moved && e.type === "pointerup") {
        const hit = drag.target.closest && drag.target.closest("[data-i]");
        if (hit) focus(+hit.getAttribute("data-i"));
      }
      drag = null;
    };
    stage.addEventListener("pointerup", end);
    stage.addEventListener("pointercancel", end);
    stage.addEventListener("dblclick", (e) => { e.preventDefault(); zoomAt(2, e.clientX, e.clientY, true); });
    function hover(e) {
      const hit = e.target.closest && e.target.closest("[data-i]");
      if (!hit || e.pointerType !== "mouse") { tip.hidden = true; setHot(focused); return; }
      const i = +hit.getAttribute("data-i");
      if (shapes[i].text) { tip.hidden = true; setHot(focused); return; }
      setHot(shapes[i].leadTo ? i : focused);
      tip.innerHTML = `<b>${esc(flat(shapes[i].label))}</b>${!flatModel && ancestors(i).length ? `<span>${esc(pathText(i))}</span>` : ""}${shapes[i].straddles.length ? `<span>${esc(straddleText(i))}</span>` : ""}${shapes[i].note ? `<span>${esc(shapes[i].note)}</span>` : ""}`;
      const r = stage.getBoundingClientRect();
      tip.hidden = false;
      const x = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8), y = Math.min(e.clientY - r.top + 16, r.height - tip.offsetHeight - 8);
      tip.style.transform = `translate(${Math.max(8, x)}px, ${Math.max(8, y)}px)`;
    }
    stage.addEventListener("pointerleave", () => { tip.hidden = true; setHot(focused); });

    // the wheel zooms once you've clicked the map (or with Ctrl held, or pinching a trackpad);
    // otherwise it scrolls the article past the map as usual
    stage.addEventListener("wheel", (e) => {
      if (!engaged && !e.ctrlKey && !e.metaKey) { showHint("Click the map first to zoom with the scroll wheel (or hold Ctrl)."); return; }
      e.preventDefault();
      touched = true;
      const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
      zoomAt(Math.exp(-px * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX, e.clientY);
    }, { passive: false });
    if (!standalone) document.documentElement.addEventListener("mouseleave", () => { engaged = false; });

    stage.addEventListener("keydown", (e) => {
      const k = e.key, pan = 80 / scale();
      if (k === "+" || k === "=") zoomAt(1.4, null, null, true);
      else if (k === "-" || k === "_") zoomAt(1 / 1.4, null, null, true);
      else if (k === "0") fit();
      else if (k === "ArrowLeft") setView({ ...vb, x: vb.x - pan });
      else if (k === "ArrowRight") setView({ ...vb, x: vb.x + pan });
      else if (k === "ArrowUp") setView({ ...vb, y: vb.y - pan });
      else if (k === "ArrowDown") setView({ ...vb, y: vb.y + pan });
      else if (k === "Escape" && focused >= 0) { const p = shapes[focused].parent; if (p >= 0) focus(p); else fit(); }
      else return;
      if (k !== "0") touched = true;
      e.preventDefault();
    });

    /* ───────── models ───────── */
    async function loadModel(id) {
      const m = models.find((x) => x.id === id) || models[0];
      if (!m) return;
      select.value = m.id;
      modelAbout = m.about || "";
      $(".dm-about").textContent = modelAbout;
      $(".dm-about").hidden = !modelAbout;
      try {
        let diagram = m.diagram;
        if (!diagram) {
          const res = await fetch(new URL(m.file, new URL(modelsUrl, location.href)));
          if (!res.ok) throw new Error(res.status);
          diagram = await res.json();
        }
        build({ title: m.name, ...diagram });
        fit(false);
        if (!hinted.has(m.id)) {
          hinted.add(m.id);
          showHint(standalone ? "Drag to move · scroll to zoom · click a name to learn more"
            : "Drag to move · click a name to learn more · click the map, then scroll to zoom", 5000);
        }
      } catch { showHint("That model couldn't be loaded."); }
      try {   // (not possible inside an article's frame, and not needed there)
        const url = new URL(location.href);
        url.searchParams.set("model", m.id);
        history.replaceState(null, "", url);
      } catch { }
    }
    select.addEventListener("change", () => { toggleList(false); loadModel(select.value); });

    (async () => {
      try {
        const d = data || await (await fetch(modelsUrl)).json();
        models = Array.isArray(d.models) ? d.models : [];
        document.title = d.title || document.title;
      } catch { models = []; }
      select.innerHTML = models.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
      $(".dm-model").hidden = models.length < 2;   // one model: no menu needed
      let start = null;
      try { start = new URLSearchParams(location.search).get("model"); } catch { }
      await loadModel(start);

    })();
  }

  window.DiagramMap = { mount };
})();

</script>
<script>
DiagramMap.mount(document.getElementById("map"), { data: {"title":"Models of the Christian family","models":[{"id":"tree","name":"The branches of Christianity","about":"Christianity's family tree from the apostles to today, coloured by the three great branches. Choose “View as” to see how each church traces the true church back to the apostles.","diagram":{"canvas":{"width":3608,"height":2530},"shapes":[{"id":"early","type":"rect","x":221.6,"y":510,"w":323.2,"h":46.4,"label":"The early church","fontSize":32,"stroke":"#1f2b23","fill":"transparent","strokeWidth":0,"textColor":"#1f2b23","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"AD 30: the apostles begin the church at Pentecost (Acts 2).","about":"The church of the apostles and those who followed them: Jewish and Gentile believers spread across the Roman world and beyond, who met in councils (Nicaea 325, Constantinople 381) to settle the faith."},{"id":"church-of-the-east","type":"rect","x":3156.0,"y":410,"w":361.6,"h":46.4,"label":"Church of the East","fontSize":32,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"431: after the Council of Ephesus, the church of the Persian Empire goes its own way.","about":"The ancient church of Mesopotamia and Persia, which accepts the first two councils; today the Assyrian Church of the East and the Ancient Church of the East."},{"id":"oriental-orthodox","type":"rect","x":3146.4,"y":460,"w":342.4,"h":46.4,"label":"Oriental Orthodox","fontSize":32,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"451: the churches that reject the Council of Chalcedon's definition of Christ's two natures.","about":"The Coptic, Ethiopian, Eritrean, Syriac, Armenian and Malankara churches, which accept three ecumenical councils and separated from the rest after the Council of Chalcedon (451)."},{"id":"eastern-orthodox","type":"rect","x":3136.8,"y":610,"w":323.2,"h":46.4,"label":"Eastern Orthodox","fontSize":32,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1054: the Great Schism divides the Greek East from the Latin West.","about":"A communion of self-governing churches (Constantinople, Russia, Greece, Romania, Serbia and others) that accept seven ecumenical councils and share the Byzantine liturgy."},{"id":"catholic","type":"rect","x":3127.2,"y":1260,"w":304.0,"h":46.4,"label":"Catholic Church","fontSize":32,"stroke":"#8a6a1f","fill":"transparent","strokeWidth":0,"textColor":"#8a6a1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1054: the Latin West, under the Bishop of Rome, after the Great Schism.","about":"The worldwide communion in union with the Bishop of Rome, the Pope: the Latin Church and 23 Eastern Catholic churches. Its bishops, with the Pope, teach and define the faith from Scripture and Tradition."},{"id":"eastern-catholic","type":"rect","x":3223.2,"y":560,"w":496.0,"h":46.4,"label":"Eastern Catholic Churches","fontSize":32,"stroke":"#8a6a1f","fill":"transparent","strokeWidth":0,"textColor":"#8a6a1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"From 1596 (the Union of Brest) and other unions: Eastern churches that entered communion with Rome.","about":"23 churches with Eastern liturgies and traditions (Byzantine, Syriac, Alexandrian, Armenian) in full communion with the Pope, such as the Ukrainian Greek Catholics, Maronites and Melkites."},{"id":"separated-eastern","type":"rect","x":3213.6,"y":660,"w":476.8,"h":46.4,"label":"Separated Eastern groups","fontSize":32,"stroke":"#3a4a8a","fill":"transparent","strokeWidth":0,"textColor":"#3a4a8a","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1666: the Old Believers reject the Russian liturgical reforms; the Old Calendarists follow in the 1920s.","about":"Orthodox groups that broke from the main Orthodox churches over reforms: the Old Believers (1650s) and the Old Calendarists (1920s)."},{"id":"separated-catholic","type":"rect","x":3223.2,"y":2260,"w":496.0,"h":46.4,"label":"Separated Catholic groups","fontSize":32,"stroke":"#8a6a1f","fill":"transparent","strokeWidth":0,"textColor":"#8a6a1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1870: the Old Catholics reject the First Vatican Council; traditionalist groups follow after 1965.","about":"Groups that keep Catholic worship and bishops but are outside communion with Rome, from the Old Catholics of the 1870s to today's traditionalist groups."},{"id":"pre-reformation","type":"rect","x":3213.6,"y":710,"w":476.8,"h":46.4,"label":"Pre-Reformation churches","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"From the 1170s (the Waldensians) and the 1400s (the Hussites, then the Moravians): reform movements in the Western church.","about":"Reform movements older than Luther: the Waldensians (1100s) and the Moravians, from the followers of Jan Hus (1400s)."},{"id":"lutheran","type":"rect","x":3060.0,"y":810,"w":169.6,"h":46.4,"label":"Lutheran","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1517: Martin Luther's Ninety-five Theses begin the Reformation.","about":"Churches from Martin Luther's reformation (1517): salvation by grace through faith, the Lutheran Confessions, and worship close to the older Western liturgy."},{"id":"reformed","type":"rect","x":3204.0,"y":1060,"w":457.6,"h":46.4,"label":"Reformed & Presbyterian","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1523: Huldrych Zwingli's reform in Zurich; then Calvin in Geneva and Knox in Scotland.","about":"Churches from the Swiss and Scottish reformations (Zwingli, Calvin, Knox): God's sovereignty, the Reformed confessions, and churches governed by elders."},{"id":"anabaptist","type":"rect","x":3079.2,"y":860,"w":208.0,"h":46.4,"label":"Anabaptist","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1525: radicals in Zurich baptize adult believers, breaking with Zwingli.","about":"The 'radical Reformation' of the 1520s: baptism of believers, nonviolence, and churches separate from the state. Mennonites, Amish, Hutterites and Brethren."},{"id":"anglican","type":"rect","x":3060.0,"y":2110,"w":169.6,"h":46.4,"label":"Anglican","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1534: the Act of Supremacy separates the Church of England from Rome.","about":"The Church of England and the churches that grew from it: Reformation teaching kept within the older pattern of bishops, liturgy and the Book of Common Prayer."},{"id":"baptist","type":"rect","x":3050.4,"y":1610,"w":150.4,"h":46.4,"label":"Baptist","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1609: English Separatists in exile (John Smyth) begin baptizing believers.","about":"Churches that baptize believers only, by immersion, with each congregation governing itself. From the English Separatists of the early 1600s."},{"id":"quakers","type":"rect","x":3146.4,"y":1710,"w":342.4,"h":46.4,"label":"Quakers (Friends)","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1650s: George Fox's movement, from England's Puritan ferment.","about":"The Religious Society of Friends, from the 1650s. Unprogrammed Friends meet in silence, waiting on the 'inner light', without clergy or outward sacraments; programmed Friends (most Friends worldwide, in Kenya and the Americas) have pastors and services much like low-church Protestants."},{"id":"brethren","type":"rect","x":3146.4,"y":2160,"w":342.4,"h":46.4,"label":"Plymouth Brethren","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"Late 1820s: assemblies begin in Dublin and Plymouth, from Anglican roots.","about":"Assemblies that began in Ireland and England in the 1820s: no clergy, led by laymen, with the Lord's Supper every week; the origin of dispensational teaching."},{"id":"methodist","type":"rect","x":3175.2,"y":1860,"w":400.0,"h":46.4,"label":"Methodist / Wesleyan","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1739: John Wesley's revival within the Church of England; a separate church in America from 1784.","about":"Churches from John and Charles Wesley's revival in the 1700s Church of England: grace offered to all, holy living, and churches joined in conferences."},{"id":"holiness","type":"rect","x":3060.0,"y":2060,"w":169.6,"h":46.4,"label":"Holiness","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1860s–80s: the holiness movement grows out of Methodism.","about":"The 1800s holiness movement that grew out of Methodism: a second work of grace that makes believers holy (entire sanctification). The Nazarenes, the Salvation Army and the Wesleyan Church."},{"id":"pentecostal","type":"rect","x":3088.8,"y":1960,"w":227.2,"h":46.4,"label":"Pentecostal","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1906: the Azusa Street revival in Los Angeles.","about":"The movement from the Azusa Street revival (1906): baptism in the Holy Spirit, speaking in tongues, healing and prophecy for today."},{"id":"charismatic","type":"rect","x":3088.8,"y":2010,"w":227.2,"h":46.4,"label":"Charismatic","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1960: Pentecostal experience spreads into older churches and new independent ones.","about":"Pentecostal-style gifts of the Spirit in independent churches and within older churches, from the 1960s on."},{"id":"nondenominational","type":"rect","x":3146.4,"y":1560,"w":342.4,"h":46.4,"label":"Nondenominational","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"From the 1960s: independent evangelical churches outside the denominations.","about":"Independent evangelical churches and networks outside the historic denominations, usually with believers' baptism and informal worship."},{"id":"united","type":"rect","x":3223.2,"y":1160,"w":496.0,"h":46.4,"label":"United & Uniting churches","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1925 on: unions such as the United Church of Canada (1925) and the Church of South India (1947).","about":"Churches formed in the 1900s by merging several Protestant traditions into one."},{"id":"stone-campbell","type":"rect","x":3117.6,"y":960,"w":284.8,"h":46.4,"label":"Stone-Campbell","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1804–1832: Barton Stone and Alexander Campbell, both from Presbyterian churches, begin the Restoration Movement.","about":"The American Restoration Movement of the early 1800s (Barton W. Stone, Alexander Campbell): no creed but the Bible, aiming to restore the New Testament church, with believers baptized by immersion. Churches of Christ, Christian Churches and the Disciples of Christ."},{"id":"adventist","type":"rect","x":3069.6,"y":1410,"w":188.8,"h":46.4,"label":"Adventist","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1844: from William Miller's movement (he was a Baptist); the Seventh-day Adventists organize in 1863.","about":"From the Millerite movement of the 1840s: waiting for Christ's return and keeping the seventh-day Sabbath. Seventh-day Adventists see Ellen G. White as a prophet whose writings guide but don't add to Scripture."},{"id":"aic","type":"rect","x":3232.8,"y":2210,"w":515.2,"h":46.4,"label":"African initiated churches","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"From the 1890s: churches founded by Africans, many out of Anglican, Methodist and early Pentecostal missions.","about":"Churches founded by Africans outside the missionary denominations since the late 1800s: the 'Zionist' churches of southern Africa, the Aladura ('praying people') churches of Nigeria, the Kimbanguists of Congo and others, with tens of millions of members. Prophecy, healing and white robes are common; beliefs vary, and a few give their founders exalted roles that other churches question."},{"id":"messianic","type":"rect","x":3146.4,"y":1660,"w":342.4,"h":46.4,"label":"Messianic Judaism","fontSize":32,"stroke":"#5f6b1f","fill":"transparent","strokeWidth":0,"textColor":"#5f6b1f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1960s–70s: Jewish believers in Jesus form their own congregations (with earlier Hebrew Christian roots). Christian-adjacent, but differs in core practices. Accepts every core tenet (Nicene faith in Yeshua, the whole Bible, baptism and the Lord's Supper); keeps Torah practice (the Sabbath, the festivals, often kosher food) and a Jewish identity.","about":"Congregations of Jewish (and non-Jewish) believers in Jesus (Yeshua) as the Messiah that keep Jewish practice: the Sabbath, the festivals and Hebrew liturgy, with evangelical, Nicene belief about Christ. It grew from the 1960s and 70s; most Jewish bodies don't regard it as Judaism."},{"id":"oneness","type":"rect","x":3165.6,"y":1910,"w":380.8,"h":46.4,"label":"Oneness Pentecostal","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1913–1916: the 'New Issue' divides the young Assemblies of God. Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah and risen Lord (fully God), the closed Bible, baptism and the Lord's Supper; denies that the Son is distinct from the Father, and so the Trinity.","about":"Pentecostals who left the Assemblies of God in 1916 over the doctrine of God (the 'New Issue'); today mainly the United Pentecostal Church International and the Pentecostal Assemblies of the World.","italic":true},{"id":"lds","type":"rect","x":3223.2,"y":1810,"w":496.0,"h":46.4,"label":"Latter Day Saint movement","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1830: Joseph Smith organizes the church in the revival country of upstate New York.","about":"Founded by Joseph Smith in 1830. Adds the Book of Mormon and other scripture and is led by living prophets and apostles. The Church of Jesus Christ of Latter-day Saints is by far the largest body. (Community of Christ, the second largest, has moved away and is shown on its own.)","italic":true},{"id":"community-of-christ","type":"rect","x":3165.6,"y":1760,"w":380.8,"h":46.4,"label":"Community of Christ","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1860: the Reorganized church under Joseph Smith III, rejecting Brigham Young's leadership. Christian-adjacent, but denies core tenets. Now accepts the Trinity, Jesus as risen Lord, baptism and communion; keeps an open canon (the Doctrine and Covenants still grows, and the Book of Mormon stays in use).","about":"Formerly the Reorganized Church of Jesus Christ of Latter Day Saints (1860), led by Joseph Smith's descendants until 1996. Since the 1990s and 2000s it has affirmed the Trinity, ordained women, and stopped treating the Book of Mormon as a test of faith, and it now sits much closer to mainline Protestantism than to the LDS Church.","italic":true},{"id":"bible-students","type":"rect","x":3194.4,"y":1310,"w":438.4,"h":46.4,"label":"Bible Student movement","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1879: Charles Taze Russell's movement, shaped by Adventist teaching.","about":"From Charles Taze Russell's Bible study movement of the 1870s. Jehovah's Witnesses, led by a Governing Body, are by far the largest part; independent Bible Students keep Russell's older ways.","italic":true},{"id":"christadelphians","type":"rect","x":3136.8,"y":910,"w":323.2,"h":46.4,"label":"Christadelphians","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1848: John Thomas, formerly of the Stone-Campbell movement. Christian-adjacent, but denies core tenets. Accepts the God of Israel, Jesus as Messiah raised from the dead, the closed Bible, baptism and the breaking of bread; denies that Jesus existed before his birth or is God, and the Trinity.","about":"Founded by John Thomas in the 1840s: lay-led and Bible-only, denying the Trinity and Jesus' existence before his birth.","italic":true},{"id":"armstrong","type":"rect","x":3223.2,"y":1510,"w":496.0,"h":46.4,"label":"Armstrong Churches of God","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1934: Herbert W. Armstrong's Radio Church of God, from the Church of God (Seventh Day), an Adventist offshoot. Christian-adjacent, but denies core tenets. Accepts the Bible and Jesus as the divine Son, distinct from the Father, with baptism; denies the Trinity (the Spirit is God's power), keeps a yearly Passover in place of the Lord's Supper, and teaches believers will become God-beings.","about":"Only the non-Trinitarian successors of Herbert W. Armstrong's Worldwide Church of God: the United Church of God, the Living Church of God and others that left when the WCG became Trinitarian in the 1990s. The WCG itself, now Grace Communion International, is an evangelical Protestant church.","italic":true},{"id":"gci","type":"rect","x":3261.6,"y":1460,"w":572.8,"h":46.4,"label":"Grace Communion International","fontSize":32,"stroke":"#2f5d4e","fill":"transparent","strokeWidth":0,"textColor":"#2f5d4e","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1995: the Worldwide Church of God embraces orthodox Christianity; renamed in 2009.","about":"The former Worldwide Church of God, renamed in 2009. In the 1990s it gave up Herbert W. Armstrong's distinctive teachings, affirmed the Trinity and joined the National Association of Evangelicals."},{"id":"swedenborgian","type":"rect","x":3232.8,"y":760,"w":515.2,"h":46.4,"label":"Swedenborgian (New Church)","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1787: followers of Emanuel Swedenborg (a Lutheran bishop's son) form the New Church in London. Christian-adjacent, but denies core tenets. Accepts Jesus as God, baptism and communion; denies that the Father and Son are distinct persons, and the closed canon (Swedenborg's writings reveal Scripture's inner meaning).","about":"Follows the visions of Emanuel Swedenborg (1700s): Jesus is the one God, and Swedenborg's writings reveal the inner meaning of Scripture.","italic":true},{"id":"uu","type":"rect","x":3194.4,"y":1010,"w":438.4,"h":46.4,"label":"Unitarian Universalism","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1825: the American Unitarian Association grows out of New England Congregationalism; it merges with the Universalists in 1961.","about":"Grew from the Unitarian and Universalist churches of New England. Now a faith without a creed, where members search for truth freely; most don't identify as Christian.","italic":true},{"id":"christian-science","type":"rect","x":3146.4,"y":1110,"w":342.4,"h":46.4,"label":"Christian Science","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1879: Mary Baker Eddy, raised a Congregationalist, founds the Church of Christ, Scientist.","about":"Founded by Mary Baker Eddy (1879): God is divine Mind, and sickness and matter are finally unreal. Her Science and Health is read alongside the Bible.","italic":true},{"id":"unification","type":"rect","x":3156.0,"y":1210,"w":361.6,"h":46.4,"label":"Unification Church","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1954: Sun Myung Moon, raised in Korean Presbyterian circles, founds the church in Seoul.","about":"Founded by Sun Myung Moon in Korea (1954), whom members see as the messiah completing Christ's mission. Now the Family Federation for World Peace and Unification.","italic":true},{"id":"inc","type":"rect","x":3146.4,"y":1360,"w":342.4,"h":46.4,"label":"Iglesia ni Cristo","fontSize":32,"stroke":"#6a3f8f","fill":"transparent","strokeWidth":0,"textColor":"#6a3f8f","fontWeight":"600","labelDy":0,"z":3,"labelAlways":true,"labelGrow":1.0,"note":"1914: Felix Manalo, who had passed through several Protestant churches (last the Adventists), founds it in Manila.","about":"Founded in the Philippines in 1914 by Felix Manalo, seen as God's last messenger. Jesus is the Son of God but not God.","italic":true},{"id":"year-30","type":"text","x":399.2,"y":2344,"label":"AD 30","fontSize":22,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"year-431","type":"text","x":799.2,"y":2344,"label":"AD 431","fontSize":22,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"year-1054","type":"text","x":1299.2,"y":2344,"label":"1054","fontSize":22,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"year-1517","type":"text","x":1699.2,"y":2344,"label":"1517","fontSize":22,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"year-1600","type":"text","x":1844.3,"y":2344,"label":"1600","fontSize":22,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"year-1700","type":"text","x":2019.2,"y":2344,"label":"1700","fontSize":22,"textColor":"#6e5628","fontWeight":"600","z":50,"labelGrow":1.3},{"id":"year sy, then true worship restored (1870s)","fontSize":24,"textColor":"#7a5a08","fontWeight":"700","z":50,"labelGrow":1.3,"pov":"jw"},{"id":"arc-label-messianic","type":"text","x":1651.6,"y":677.5,"label":"The first believers' Jewish way, renewed (1960s–70s)","fontSize":24,"textColor":"#7a5a08","fontWeight":"700","z":50,"labelGrow":1.3,"pov":"messianic"},{"id":"legend","type":"text","x":1425.3,"y":2430,"label":"Gold: Catholic · Blue: Orthodox and Eastern · Green: Protestant · Olive: Messianic Judaism\nPurple names: restorationist in method · Dotted purple: on the edge of Christianity or outside it\nChoose “View as” to see how a church traces the true church back to the apostles; hover or click a name for more.","fontSize":22,"textColor":"#3b2c14","fontWeight":"400","z":50,"labelGrow":1.3},{"id":"title","type":"text","x":1425.3,"y":130,"label":"The branches of Christianity","fontSize":46,"textColor":"#1f2b23","fontWeight":"700","z":50,"labelGrow":1.3},{"id":"subtitle","type":"text","x":1425.3,"y":184,"label":"A family tree from the apostles to today","fontSize":24,"textColor":"#1f2b23","fontWeight":"400","z":50,"labelGrow":1.3}],"arrows":[],"paths":[{"id":"grid-2000","d":"M 2881.2 320.0 L 2881.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-1900","d":"M 2569.2 320.0 L 2569.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-1800","d":"M 2279.2 320.0 L 2279.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-1700","d":"M 2019.2 320.0 L 2019.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-1600","d":"M 1844.3 320.0 L 1844.3 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-1517","d":"M 1699.2 320.0 L 1699.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-1054","d":"M 1299.2 320.0 L 1299.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-431","d":"M 799.2 320.0 L 799.2 2310.0","stroke":"#c9a860","width":1.5,"dashed":"4 10"},{"id":"grid-30", messianic","d":"M 469.0 510.0 Q 1651.6 290.0 2834.2 1660.0","stroke":"#b8860b","width":5,"dashed":"12 10","pov":"messianic"}],"povs":[{"id":"catholic","name":"Catholic","text":"The Catholic Church sees itself as the one Church Jesus founded on Peter, continuing unbroken through the bishops of Rome. The Orthodox and other Eastern churches are true churches separated from it; Protestant communities are 'separated brethren'.","paths":["early-a","early-b","catholic-a","catholic-b","eastern-catholic"],"nodes":["early","catholic","eastern-catholic"]},{"id":"orthodox","name":"Eastern Orthodox","text":"The Orthodox Church sees itself as the one, holy, catholic and apostolic Church, keeping the faith of the seven councils unchanged; Rome departed from it in the Great Schism of 1054.","paths":["early-a","early-b","eastern-orthodox"],"nodes":["early","eastern-orthodox"]},{"id":"oriental","name":"Oriental Orthodox","text":"The Oriental Orthodox churches see themselves as keeping the faith of the first three councils and of St Cyril of Alexandria; the Council of Chalcedon (451) is where the others went astray.","paths":["early-a","early-b","oriental-orthodox"],"nodes":["early","oriental-orthodox"]},{"id":"east","name":"Church of the East","text":"The Church of the East traces itself to the apostles Thomas and Addai (Thaddeus) in Mesopotamia and Persia, continuing outside the Roman Empire's councils after Ephesus (431).","paths":["early-a","early-b","church-of-the-east"],"nodes":["early","church-of-the-east"]},{"id":"anglican","name":"Anglican","text":"Many Anglicans hold the 'branch theory': the one Church continues in three branches with bishops in apostolic succession (Catholic, Orthodox and Anglican). The Church of England reformed itself in the 1500s without breaking that succession.","paths":["early-a","early-b","catholic-a","catholic-b","eastern-orthodox","anglican"],"nodes":["early","catholic","eastern-orthodox","anglican"]},{"id":"protestant","name":"Lutheran and Reformed","text":"The true church is wherever the gospel is rightly preached and the sacraments rightly given. It lived on in the Western church, and the Reformation of the 1500s recovered the gospel within it.","paths":["early-a","early-b","catholic-a","lutheran","reformed"],"nodes":["early","lutheran","reformed"]},{"id":"baptist","name":"Baptist","text":"Most Baptists see a spiritual succession of faithful believers in every age rather than an unbroken institution. Some ('Landmark' Baptists) trace a chain of believers' churches through dissenting groups such as the Waldensians and the Anabaptists.","paths":["early-a","early-b","catholic-a","pre-reformation","anabaptist","baptist"],"nodes":["early","pre-reformation","anabaptist","baptist"]},{"id":"pentecostal","name":"Pentecostal","text":"Pentecostals stand in the Protestant line, but see the Azusa Street revival (1906) as the 'latter rain': the apostles' spiritual gifts poured out again after centuries of neglect.","paths":["early-a","early-b","catholic-a","anglican","methodist","holiness","pentecostal","charismatic"],"nodes":["early","pentecostal","charismatic"]},{"id":"stone-campbell","name":"Stone-Campbell","text":"The church drifted from the New Testament pattern as creeds and denominations grew. The Restoration Movement of the early 1800s set out to restore the church as the apostles left it, by the Bible alone.","paths":["early-a","stone-campbell"],"nodes":["early","stone-campbell"]},{"id":"oneness","name":"Oneness Pentecostal","text":"Oneness Pentecostals see the apostles' teaching (baptism in Jesus' name, Acts 2:38) as lost after the first century, and restored in the 'New Issue' of 1913–14.","paths":["early-a","oneness"],"nodes":["early","oneness"]},{"id":"lds","name":"Latter-day Saint","text":"Latter-day Saints teach that a Great Apostasy followed the deaths of the apostles, and that Christ restored his church and its priesthood through Joseph Smith in 1830.","paths":["early-a","lds"],"nodes":["early","lds"]},{"id":"jw","name":"Jehovah's Witness","text":"Jehovah's Witnesses teach that true worship was corrupted after the apostles died and was restored through the Bible Students from the 1870s; they hold that Jesus appointed their leaders as his 'faithful slave' in 1919.","paths":["early-a","bible-students"],"nodes":["early","bible-students"]},{"id":"messianic","name":"Messianic Jewish","text":"Messianic Jews see themselves as renewing the first community of Jesus' followers: Jews who kept their Jewish way of life. That way of following Yeshua faded early and revived in the 1960s and 70s.","paths":["early-a","messianic"],"nodes":["early","messianic"]}],"flat":true}},{"id":"families","name":"The five families of Christianity","about":"The five families of Christianity: Apostolic–liturgical, confessional Protestant, believers' church, holiness–Pentecostal–charismatic, and Restorationists","diagram":{"canvas":{"width":3327,"height":3516},"shapes":[{"id":"christianity","x":1417.3,"y":1668.1,"r":1347.3,"label":"Christianity","fontSize":28,"stroke":"#1f2b23","fill":"#fdfcf8","textColor":"#1f2b23","strokeWidth":3,"fontWeight":"600","z":0,"labelDy":-1312.4,"note":"Christianity is the one religion of the God of Israel that confesses Jesus of Nazareth as Messiah and risen Lord, distinct from the Father who sent and raised him; receives the Jewish Scriptures and the apostolic writings as a closed canon; and gathers people by baptism and the Lord’s Supper."},{"id":"apostolic-liturgical","x":1901.5,"y":2179.2,"r":602.6,"label":"Apostolic–liturgical","fontSize":21,"stroke":"#8a6a1f","fill":"#f7f0dc","textColor":"#8a6a1f","strokeWidth":2.2,"fontWeight":"600","z":1,"labelDy":-578.1,"about":"Churches with bishops in apostolic succession, sacramental worship and a set liturgy: the Catholic and Orthodox churches, the older Eastern churches, and independent sacramental groups. Includes: Church of the East, Oriental Orthodox, Catholic Church, Eastern Orthodox, Independent sacramental groups."}
